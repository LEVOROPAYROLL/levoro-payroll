<!DOCTYPE html>
<html>
<head>
    <title>LEVORO</title>
    <style>
        body { font-family: Arial; background: #4c63d2; padding: 20px; margin: 0; }
        .box { background: white; max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 8px; }
        h1 { text-align: center; color: #3b5bdb; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #3b5bdb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button:hover { background: #2c4ab0; }
        p { text-align: center; font-size: 12px; color: #666; margin-top: 15px; }
        .admin { max-width: 1000px; margin: 0 auto; }
        .admin h1 { color: white; margin: 20px 0; }
        .admin-content { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; }
        .item { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .item-selected { background: #e3f2fd; }
        .emp-form { background: #f9f9f9; padding: 15px; border-radius: 4px; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        let db = {
            companies: [],
            employees: []
        };
        let user = null;
        let selectedCo = null;

        function loadDB() {
            const saved = localStorage.getItem('levoro');
            if (saved) {
                db = JSON.parse(saved);
            }
        }

        function saveDB() {
            localStorage.setItem('levoro', JSON.stringify(db));
        }

        function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            
            if (u === 'admin' && p === 'admin123') {
                user = { role: 'admin' };
                show();
                return;
            }
            
            const emp = db.employees.find(e => e.u === u && e.p === p);
            if (emp) {
                user = emp;
                selectedCo = emp.c;
                show();
                return;
            }
            
            alert('Wrong!');
        }

        function logout() {
            user = null;
            selectedCo = null;
            show();
        }

        function addCo() {
            const name = prompt('Company name:');
            if (name) {
                db.companies.push({ id: Date.now(), name: name });
                saveDB();
                show();
            }
        }

        function selectCo(id) {
            selectedCo = id;
            show();
        }

        function addEmp() {
            const n = prompt('Name:');
            if (!n) return;
            const u = prompt('Username:');
            if (!u) return;
            const p = prompt('Password:');
            if (!p) return;
            const e = prompt('Email:');
            const r = prompt('Rate (default 15):', '15');
            
            db.employees.push({
                id: Date.now(),
                name: n,
                u: u,
                p: p,
                email: e,
                rate: parseFloat(r),
                c: selectedCo
            });
            saveDB();
            alert('Employee added: ' + u);
            show();
        }

        function delCo(id) {
            db.companies = db.companies.filter(c => c.id !== id);
            db.employees = db.employees.filter(e => e.c !== id);
            if (selectedCo === id) selectedCo = null;
            saveDB();
            show();
        }

        function delEmp(id) {
            db.employees = db.employees.filter(e => e.id !== id);
            saveDB();
            show();
        }

        function show() {
            const app = document.getElementById('app');
            
            if (!user) {
                app.innerHTML = `
                    <div class="box">
                        <h1>LEVORO</h1>
                        <input type="text" id="u" placeholder="Username" value="admin">
                        <input type="password" id="p" placeholder="Password" value="admin123">
                        <button onclick="login()">Login</button>
                        <p>Default: admin / admin123</p>
                    </div>
                `;
                return;
            }

            if (user.role === 'admin') {
                const co = db.companies.find(c => c.id === selectedCo);
                const emps = selectedCo ? db.employees.filter(e => e.c === selectedCo) : [];
                
                app.innerHTML = `
                    <h1 style="color: white; margin: 20px 0;">LEVORO Admin <button class="btn" onclick="logout()" style="width: auto; padding: 8px 16px;">Logout</button></h1>
                    <div class="admin-content">
                        <div class="panel">
                            <h3>Companies (${db.companies.length})</h3>
                            ${db.companies.map(c => `
                                <div class="item ${selectedCo === c.id ? 'item-selected' : ''}" onclick="selectCo(${c.id})">
                                    <span><strong>${c.name}</strong></span>
                                    <button onclick="delCo(${c.id}); event.stopPropagation();" style="width: auto; padding: 4px 8px; font-size: 12px; background: #dc3545;">X</button>
                                </div>
                            `).join('')}
                            <button onclick="addCo()">+ Add Company</button>
                        </div>

                        <div class="panel">
                            <h3>${co ? co.name + ' Employees' : 'Select company'}</h3>
                            ${selectedCo ? `
                                <button onclick="addEmp()">+ Add Employee</button>
                                ${emps.map(e => `
                                    <div class="item">
                                        <div><strong>${e.name}</strong><br><small>@${e.u} • $${e.rate}</small></div>
                                        <button onclick="delEmp(${e.id})" style="width: auto; padding: 4px 8px; font-size: 12px; background: #dc3545;">X</button>
                                    </div>
                                `).join('')}
                            ` : '<p>Select a company</p>'}
                        </div>
                    </div>
                `;
                return;
            }

            if (user.role === 'employee') {
                app.innerHTML = `
                    <div class="admin" style="background: white; padding: 30px; border-radius: 8px; margin-top: 50px;">
                        <h1 style="color: #3b5bdb;">Welcome ${user.name} <button class="btn" onclick="logout()" style="width: auto; padding: 8px 16px;">Logout</button></h1>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Rate:</strong> $${user.rate}/hr</p>
                    </div>
                `;
            }
        }

        loadDB();
        show();
    </script>
</body>
</html>
