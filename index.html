<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVORO Payroll</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const LEVOROPayroll = () => {
          const [currentUser, setCurrentUser] = useState(null);
          const [userRole, setUserRole] = useState(null);
          const [selectedCompany, setSelectedCompany] = useState(null);
          const [loginUsername, setLoginUsername] = useState('');
          const [loginPassword, setLoginPassword] = useState('');
          const [companies, setCompanies] = useState([]);
          const [employees, setEmployees] = useState([]);
          const [timesheets, setTimesheets] = useState([]);
          const [paystubs, setPaystubs] = useState([]);
          const [activityLog, setActivityLog] = useState([]);
          const [showAddCompany, setShowAddCompany] = useState(false);
          const [newCompanyName, setNewCompanyName] = useState('');
          const [newPayrollType, setNewPayrollType] = useState('weekly');
          const [newPayrollStartDate, setNewPayrollStartDate] = useState('2026-01-01');
          const [newManagerName, setNewManagerName] = useState('');
          const [newManagerUsername, setNewManagerUsername] = useState('');
          const [newManagerPassword, setNewManagerPassword] = useState('');
          const [showAddEmployee, setShowAddEmployee] = useState(false);
          const [newEmployeeName, setNewEmployeeName] = useState('');
          const [newEmployeeUsername, setNewEmployeeUsername] = useState('');
          const [newEmployeePassword, setNewEmployeePassword] = useState('');
          const [newEmployeeEmail, setNewEmployeeEmail] = useState('');
          const [newEmployeePhone, setNewEmployeePhone] = useState('');
          const [newEmployeeAddress, setNewEmployeeAddress] = useState('');
          const [newEmployeeRate, setNewEmployeeRate] = useState('15.00');
          const [editingProfile, setEditingProfile] = useState(false);
          const [profileData, setProfileData] = useState({});

          useEffect(() => {
            const compData = localStorage.getItem('levoro_companies');
            const empData = localStorage.getItem('levoro_employees');
            const tsData = localStorage.getItem('levoro_timesheets');
            const psData = localStorage.getItem('levoro_paystubs');
            const logData = localStorage.getItem('levoro_activity_log');
            
            if (compData) setCompanies(JSON.parse(compData));
            if (empData) setEmployees(JSON.parse(empData));
            if (tsData) setTimesheets(JSON.parse(tsData));
            if (psData) setPaystubs(JSON.parse(psData));
            if (logData) setActivityLog(JSON.parse(logData));
          }, []);

          useEffect(() => {
            localStorage.setItem('levoro_companies', JSON.stringify(companies));
            localStorage.setItem('levoro_employees', JSON.stringify(employees));
            localStorage.setItem('levoro_timesheets', JSON.stringify(timesheets));
            localStorage.setItem('levoro_paystubs', JSON.stringify(paystubs));
            localStorage.setItem('levoro_activity_log', JSON.stringify(activityLog));
          }, [companies, employees, timesheets, paystubs, activityLog]);

          const addLog = (action, description) => {
            setActivityLog([...activityLog, {
              id: Date.now(),
              action,
              description,
              userId: currentUser?.id,
              userName: currentUser?.name,
              timestamp: new Date().toISOString()
            }]);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            if (loginUsername === 'admin' && loginPassword === 'admin123') {
              setCurrentUser({ id: 'admin', username: 'admin', name: 'Admin', role: 'admin' });
              setUserRole('admin');
              addLog('LOGIN', 'Admin logged in');
              setLoginUsername('');
              setLoginPassword('');
            } else {
              const user = employees.find(emp => emp.username === loginUsername && emp.password === loginPassword);
              if (user) {
                setCurrentUser(user);
                setSelectedCompany(user.companyId);
                setProfileData(user);
                if (user.role === 'manager') {
                  setUserRole('manager');
                } else {
                  setUserRole('employee');
                }
                addLog('LOGIN', `${user.name} logged in`);
                setLoginUsername('');
                setLoginPassword('');
              } else {
                alert('Invalid credentials');
              }
            }
          };

          const handleAddCompany = (e) => {
            e.preventDefault();
            const newComp = {
              id: Date.now(),
              name: newCompanyName,
              payrollType: newPayrollType,
              payrollStartDate: newPayrollStartDate,
              createdAt: new Date().toISOString()
            };
            setCompanies([...companies, newComp]);
            addLog('CREATE_COMPANY', `Company "${newCompanyName}" created`);
            
            if (newManagerName && newManagerUsername && newManagerPassword) {
              const manager = {
                id: Date.now() + 1,
                name: newManagerName,
                username: newManagerUsername,
                password: newManagerPassword,
                email: `${newManagerUsername}@company.com`,
                hourlyRate: 0,
                companyId: newComp.id,
                role: 'manager',
                address: '',
                phone: '',
                createdAt: new Date().toISOString()
              };
              setEmployees([...employees, manager]);
              addLog('CREATE_MANAGER', `Manager "${newManagerName}" created`);
            }
            
            setNewCompanyName('');
            setNewManagerName('');
            setNewManagerUsername('');
            setNewManagerPassword('');
            setShowAddCompany(false);
          };

          const deleteCompany = (companyId) => {
            setCompanies(companies.filter(c => c.id !== companyId));
            setEmployees(employees.filter(e => e.companyId !== companyId));
            addLog('DELETE_COMPANY', 'Company deleted');
          };

          const handleAddEmployee = (e) => {
            e.preventDefault();
            const newEmp = {
              id: Date.now(),
              name: newEmployeeName,
              username: newEmployeeUsername,
              password: newEmployeePassword,
              email: newEmployeeEmail,
              phone: newEmployeePhone,
              address: newEmployeeAddress,
              hourlyRate: parseFloat(newEmployeeRate),
              companyId: selectedCompany,
              role: 'employee',
              createdAt: new Date().toISOString()
            };
            setEmployees([...employees, newEmp]);
            addLog('CREATE_EMPLOYEE', `Employee "${newEmployeeName}" created`);
            
            setNewEmployeeName('');
            setNewEmployeeUsername('');
            setNewEmployeePassword('');
            setNewEmployeeEmail('');
            setNewEmployeePhone('');
            setNewEmployeeAddress('');
            setNewEmployeeRate('15.00');
            setShowAddEmployee(false);
          };

          const updateEmployeeProfile = (e) => {
            e.preventDefault();
            setEmployees(employees.map(emp => 
              emp.id === currentUser.id ? { ...emp, ...profileData } : emp
            ));
            setCurrentUser({ ...currentUser, ...profileData });
            addLog('UPDATE_PROFILE', `${profileData.name} updated profile`);
            setEditingProfile(false);
          };

          const handleLogout = () => {
            addLog('LOGOUT', `${currentUser.name} logged out`);
            setCurrentUser(null);
            setUserRole(null);
            setSelectedCompany(null);
          };

          if (userRole === 'admin') {
            const selectedComp = companies.find(c => c.id === selectedCompany);
            const companyEmps = selectedCompany ? employees.filter(e => e.companyId === selectedCompany) : [];

            return (
              <div style={{ padding: '20px', maxWidth: '1200px', margin: '0 auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                  <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 500 }}>LEVORO - Admin</h1>
                  <button onClick={handleLogout} style={{ padding: '8px 16px', fontSize: '13px', background: '#f0f0f0', border: '1px solid #ddd', borderRadius: '6px', cursor: 'pointer' }}>Logout</button>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '20px', marginBottom: '24px' }}>
                  <div>
                    <h2 style={{ margin: '0 0 12px 0', fontSize: '18px', fontWeight: 500 }}>Companies ({companies.length})</h2>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '12px', marginBottom: '16px' }}>
                      {companies.map(comp => (
                        <div key={comp.id} style={{ background: selectedCompany === comp.id ? '#e8f5f7' : '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', cursor: 'pointer' }} onClick={() => setSelectedCompany(comp.id)}>
                          <p style={{ margin: '0 0 8px 0', fontSize: '14px', fontWeight: 500 }}>{comp.name}</p>
                          <p style={{ margin: '0 0 4px 0', fontSize: '11px', color: '#666' }}>📅 {comp.payrollType}</p>
                          <p style={{ margin: '0', fontSize: '12px', color: '#666' }}>{employees.filter(e => e.companyId === comp.id).length} users</p>
                          <button onClick={(e) => { e.stopPropagation(); deleteCompany(comp.id); }} style={{ marginTop: '8px', padding: '4px 8px', fontSize: '11px', background: 'transparent', border: '1px solid #ddd', borderRadius: '6px', cursor: 'pointer' }}>Delete</button>
                        </div>
                      ))}
                    </div>
                    <button onClick={() => setShowAddCompany(!showAddCompany)} style={{ padding: '8px 16px', fontSize: '13px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>+ Add Company</button>

                    {showAddCompany && (
                      <form onSubmit={handleAddCompany} style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', marginTop: '16px' }}>
                        <h3 style={{ margin: '0 0 12px 0', fontSize: '16px' }}>Create Company & Manager</h3>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Company Name</label>
                          <input type="text" value={newCompanyName} onChange={(e) => setNewCompanyName(e.target.value)} placeholder="e.g., ABC Logistics" style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                          <div>
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Payroll Type</label>
                            <select value={newPayrollType} onChange={(e) => setNewPayrollType(e.target.value)} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }}>
                              <option value="weekly">Weekly</option>
                              <option value="biweekly">Bi-Weekly</option>
                            </select>
                          </div>
                          <div>
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Start Date</label>
                            <input type="date" value={newPayrollStartDate} onChange={(e) => setNewPayrollStartDate(e.target.value)} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                          </div>
                        </div>
                        <h3 style={{ margin: '12px 0 8px 0', fontSize: '14px' }}>Manager (Optional)</h3>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Manager Name</label>
                          <input type="text" value={newManagerName} onChange={(e) => setNewManagerName(e.target.value)} placeholder="Full name" style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                          <div>
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Username</label>
                            <input type="text" value={newManagerUsername} onChange={(e) => setNewManagerUsername(e.target.value)} placeholder="e.g., john_manager" style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                          </div>
                          <div>
                            <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Password</label>
                            <input type="password" value={newManagerPassword} onChange={(e) => setNewManagerPassword(e.target.value)} placeholder="Password" style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                          </div>
                        </div>
                        <button type="submit" style={{ width: '100%', padding: '10px', fontSize: '13px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 500 }}>Create</button>
                      </form>
                    )}
                  </div>

                  <div>
                    <h2 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: 500 }}>Activity Log</h2>
                    <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '8px', padding: '12px', maxHeight: '500px', overflowY: 'auto', fontSize: '11px' }}>
                      {activityLog.slice().reverse().map(log => (
                        <div key={log.id} style={{ borderBottom: '1px solid #eee', paddingBottom: '8px', marginBottom: '8px' }}>
                          <p style={{ margin: '0', fontWeight: 500, color: '#333' }}>{log.action}</p>
                          <p style={{ margin: '2px 0 0 0', color: '#666' }}>{log.description}</p>
                          <p style={{ margin: '2px 0 0 0', color: '#999', fontSize: '10px' }}>{new Date(log.timestamp).toLocaleString()}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {selectedCompany && selectedComp && (
                  <div>
                    <h2 style={{ margin: '0 0 16px 0', fontSize: '18px', fontWeight: 500 }}>Manage {selectedComp.name}</h2>
                    <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', marginBottom: '24px' }}>
                      <h3 style={{ margin: '0 0 12px 0', fontSize: '14px' }}>Users ({companyEmps.length})</h3>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                        <div></div>
                        <button onClick={() => setShowAddEmployee(!showAddEmployee)} style={{ padding: '8px 16px', fontSize: '13px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>+ Add Employee</button>
                      </div>

                      {showAddEmployee && (
                        <form onSubmit={handleAddEmployee} style={{ background: '#f9f9f9', border: '1px solid #ddd', borderRadius: '8px', padding: '12px', marginBottom: '12px' }}>
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' }}>
                            <input type="text" placeholder="Name" value={newEmployeeName} onChange={(e) => setNewEmployeeName(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="text" placeholder="Username" value={newEmployeeUsername} onChange={(e) => setNewEmployeeUsername(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="password" placeholder="Password" value={newEmployeePassword} onChange={(e) => setNewEmployeePassword(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="email" placeholder="Email" value={newEmployeeEmail} onChange={(e) => setNewEmployeeEmail(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="text" placeholder="Phone" value={newEmployeePhone} onChange={(e) => setNewEmployeePhone(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="text" placeholder="Address" value={newEmployeeAddress} onChange={(e) => setNewEmployeeAddress(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <input type="number" placeholder="Hourly Rate" value={newEmployeeRate} onChange={(e) => setNewEmployeeRate(e.target.value)} style={{ padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                            <button type="submit" style={{ padding: '8px', fontSize: '13px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 500 }}>Add</button>
                          </div>
                        </form>
                      )}

                      {companyEmps.map(emp => (
                        <div key={emp.id} style={{ background: '#f9f9f9', border: '1px solid #ddd', borderRadius: '8px', padding: '12px', marginBottom: '8px' }}>
                          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: '12px', alignItems: 'center' }}>
                            <div>
                              <p style={{ margin: '0 0 2px 0', fontSize: '13px', fontWeight: 500 }}>{emp.name} <span style={{ fontSize: '11px', color: '#666', background: '#e8e8e8', padding: '2px 6px', borderRadius: '3px', marginLeft: '8px' }}>{emp.role}</span></p>
                              <p style={{ margin: '0', fontSize: '11px', color: '#666' }}>@{emp.username} • {emp.email} • ${emp.hourlyRate.toFixed(2)}/hr</p>
                            </div>
                            <button onClick={() => setEmployees(employees.filter(e => e.id !== emp.id))} style={{ padding: '4px 12px', fontSize: '12px', background: '#e74c3c', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>Delete</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          }

          if (userRole === 'employee' && currentUser) {
            const companyName = companies.find(c => c.id === selectedCompany)?.name || 'LEVORO';
            return (
              <div style={{ padding: '20px', maxWidth: '900px', margin: '0 auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                  <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 500 }}>{companyName}</h1>
                  <button onClick={handleLogout} style={{ padding: '8px 16px', fontSize: '13px', background: '#f0f0f0', border: '1px solid #ddd', borderRadius: '6px', cursor: 'pointer' }}>Logout</button>
                </div>

                <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', marginBottom: '24px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                    <h2 style={{ margin: 0, fontSize: '16px', fontWeight: 500 }}>My Profile</h2>
                    <button onClick={() => setEditingProfile(!editingProfile)} style={{ padding: '6px 12px', fontSize: '12px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>
                      {editingProfile ? 'Cancel' : 'Edit'}
                    </button>
                  </div>

                  {editingProfile ? (
                    <form onSubmit={updateEmployeeProfile}>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '12px' }}>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Name</label>
                          <input type="text" value={profileData.name || ''} onChange={(e) => setProfileData({...profileData, name: e.target.value})} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Email</label>
                          <input type="email" value={profileData.email || ''} onChange={(e) => setProfileData({...profileData, email: e.target.value})} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Phone</label>
                          <input type="text" value={profileData.phone || ''} onChange={(e) => setProfileData({...profileData, phone: e.target.value})} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', fontSize: '12px', fontWeight: 500, marginBottom: '4px' }}>Address</label>
                          <input type="text" value={profileData.address || ''} onChange={(e) => setProfileData({...profileData, address: e.target.value})} style={{ width: '100%', padding: '8px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '6px' }} />
                        </div>
                      </div>
                      <button type="submit" style={{ width: '100%', padding: '10px', fontSize: '13px', background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 500 }}>Save Changes</button>
                    </form>
                  ) : (
                    <div>
                      <p style={{ margin: '0 0 8px 0', fontSize: '13px' }}><strong>Name:</strong> {currentUser.name}</p>
                      <p style={{ margin: '0 0 8px 0', fontSize: '13px' }}><strong>Email:</strong> {currentUser.email}</p>
                      <p style={{ margin: '0 0 8px 0', fontSize: '13px' }}><strong>Phone:</strong> {currentUser.phone || 'Not set'}</p>
                      <p style={{ margin: '0', fontSize: '13px' }}><strong>Address:</strong> {currentUser.address || 'Not set'}</p>
                    </div>
                  )}
                </div>

                <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px' }}>
                  <h2 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: 500 }}>Time Entry (Coming Soon)</h2>
                  <p style={{ margin: 0, color: '#666', fontSize: '13px' }}>Time entry feature will be available soon.</p>
                </div>
              </div>
            );
          }

          if (userRole === 'manager' && currentUser && selectedCompany) {
            const companyName = companies.find(c => c.id === selectedCompany)?.name || 'LEVORO';
            const companyEmployees = employees.filter(e => e.companyId === selectedCompany && e.role === 'employee');
            
            return (
              <div style={{ padding: '20px', maxWidth: '1000px', margin: '0 auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                  <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 500 }}>{companyName} - Manager</h1>
                  <button onClick={handleLogout} style={{ padding: '8px 16px', fontSize: '13px', background: '#f0f0f0', border: '1px solid #ddd', borderRadius: '6px', cursor: 'pointer' }}>Logout</button>
                </div>

                <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', marginBottom: '24px' }}>
                  <h2 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: 500 }}>My Team ({companyEmployees.length} employees)</h2>
                  {companyEmployees.length === 0 ? (
                    <p style={{ margin: 0, color: '#666', fontSize: '13px' }}>No employees in this company yet.</p>
                  ) : (
                    <div>
                      {companyEmployees.map(emp => (
                        <div key={emp.id} style={{ background: '#f9f9f9', border: '1px solid #ddd', borderRadius: '8px', padding: '12px', marginBottom: '8px' }}>
                          <p style={{ margin: '0 0 4px 0', fontSize: '13px', fontWeight: 500 }}>{emp.name}</p>
                          <p style={{ margin: '0', fontSize: '12px', color: '#666' }}>@{emp.username} • {emp.email} • ${emp.hourlyRate.toFixed(2)}/hr</p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px' }}>
                  <h2 style={{ margin: '0 0 12px 0', fontSize: '16px', fontWeight: 500 }}>Approvals (Coming Soon)</h2>
                  <p style={{ margin: 0, color: '#666', fontSize: '13px' }}>Time entry approvals will be available soon.</p>
                </div>
              </div>
            );
          }

          return (
            <div style={{ padding: '40px 20px', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ width: '100%', maxWidth: '400px' }}>
                <h1 style={{ textAlign: 'center', margin: '0 0 8px 0', fontSize: '32px', fontWeight: 500 }}>LEVORO</h1>
                <p style={{ textAlign: 'center', margin: '0 0 32px 0', fontSize: '14px', color: '#666' }}>Payroll Time Tracking & Approval</p>

                <form onSubmit={handleLogin} style={{ background: '#fff', border: '1px solid #ddd', borderRadius: '12px', padding: '24px' }}>
                  <div style={{ marginBottom: '16px' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: 500, marginBottom: '6px' }}>Username</label>
                    <input type="text" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} style={{ width: '100%', padding: '10px 12px', fontSize: '14px', border: '1px solid #ddd', borderRadius: '6px', boxSizing: 'border-box' }} />
                  </div>

                  <div style={{ marginBottom: '24px' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: 500, marginBottom: '6px' }}>Password</label>
                    <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} style={{ width: '100%', padding: '10px 12px', fontSize: '14px', border: '1px solid #ddd', borderRadius: '6px', boxSizing: 'border-box' }} />
                  </div>

                  <button type="submit" style={{ width: '100%', padding: '12px', fontSize: '14px', fontWeight: 500, background: '#0066cc', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>Login</button>
                </form>

                <div style={{ marginTop: '24px', background: '#f0f8ff', border: '1px solid #ddd', borderRadius: '12px', padding: '16px', fontSize: '12px', color: '#333' }}>
                  <p style={{ margin: '0 0 8px 0', fontWeight: 500 }}>Admin Demo:</p>
                  <p style={{ margin: '0' }}>Username: <strong>admin</strong></p>
                  <p style={{ margin: '0' }}>Password: <strong>admin123</strong></p>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LEVOROPayroll />);
    </script>
</body>
</html>
