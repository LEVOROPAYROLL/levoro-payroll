<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVORO Payroll</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #f0f4f8; 
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 10px 0; }
        .btn { 
            padding: 10px 16px; 
            background: #3b5bdb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 5px;
            font-size: 14px;
        }
        .btn-danger { background: #dc3545; }
        input, select { 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            margin: 5px 0; 
            width: 100%;
            font-size: 14px;
        }
        input[type="password"] { border-color: #e74c3c; border-width: 2px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        h1 { font-size: 28px; }
        h3 { margin: 10px 0; }
        .grid { display: grid; gridTemplateColumns: 300px 1fr; gap: 20px; }
        .item { 
            padding: 10px; 
            background: #f9f9f9; 
            margin: 8px 0; 
            border-radius: 4px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }
        .item.selected { background: #e3f2fd; }
        .item.clickable { cursor: pointer; }
        .form { background: #f9f9f9; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const app = document.getElementById('app');
        let state = {
            user: null,
            companies: [],
            employees: [],
            selectedCo: null
        };

        function load() {
            const saved = localStorage.getItem('levoro_data');
            if (saved) {
                const data = JSON.parse(saved);
                state.companies = data.companies || [];
                state.employees = data.employees || [];
            }
        }

        function save() {
            localStorage.setItem('levoro_data', JSON.stringify({
                companies: state.companies,
                employees: state.employees
            }));
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            if (username === 'admin' && password === 'admin123') {
                state.user = { id: 'admin', name: 'Admin', role: 'admin' };
                render();
                return;
            }

            const emp = state.employees.find(e => e.username === username && e.password === password);
            if (emp) {
                state.user = emp;
                state.selectedCo = emp.companyId;
                render();
                return;
            }

            alert('Invalid username or password');
        }

        function handleAddCompany(e) {
            e.preventDefault();
            const name = document.getElementById('coName').value;
            if (!name) return;

            state.companies.push({
                id: Date.now(),
                name: name
            });
            save();
            document.getElementById('coName').value = '';
            document.getElementById('addCoForm').classList.add('hidden');
            render();
        }

        function handleAddEmployee(e) {
            e.preventDefault();
            const name = document.getElementById('empName').value;
            const username = document.getElementById('empUser').value;
            const password = document.getElementById('empPass').value;
            const email = document.getElementById('empEmail').value;
            const rate = document.getElementById('empRate').value;

            if (!name || !username || !password) {
                alert('Name, Username, Password are required!');
                return;
            }

            if (!state.selectedCo) {
                alert('Select a company first');
                return;
            }

            state.employees.push({
                id: Date.now(),
                name: name,
                username: username,
                password: password,
                email: email,
                hourlyRate: parseFloat(rate),
                companyId: state.selectedCo,
                role: 'employee'
            });

            console.log('✓ Employee created:', username);
            save();
            alert('Employee created! Username: ' + username);
            
            document.getElementById('empName').value = '';
            document.getElementById('empUser').value = '';
            document.getElementById('empPass').value = '';
            document.getElementById('empEmail').value = '';
            document.getElementById('empRate').value = '15';
            document.getElementById('addEmpForm').classList.add('hidden');
            render();
        }

        function logout() {
            state.user = null;
            state.selectedCo = null;
            render();
        }

        function deleteCo(id) {
            state.companies = state.companies.filter(c => c.id !== id);
            state.employees = state.employees.filter(e => e.companyId !== id);
            if (state.selectedCo === id) state.selectedCo = null;
            save();
            render();
        }

        function deleteEmp(id) {
            state.employees = state.employees.filter(e => e.id !== id);
            save();
            render();
        }

        function selectCo(id) {
            state.selectedCo = id;
            render();
        }

        function render() {
            if (!state.user) {
                app.innerHTML = `
                    <div class="container" style="max-width: 400px; margin-top: 100px;">
                        <div class="card">
                            <h1 style="text-align: center; margin-bottom: 30px;">LEVORO</h1>
                            <form onsubmit="handleLogin(event)">
                                <label>Username</label>
                                <input type="text" id="loginUser" placeholder="Enter username" required>
                                
                                <label style="margin-top: 15px;">Password</label>
                                <input type="password" id="loginPass" placeholder="Enter password" required>
                                
                                <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Login</button>
                            </form>
                            <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #666;">
                                Demo: admin / admin123
                            </p>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.user.role === 'admin') {
                const coEmps = state.selectedCo 
                    ? state.employees.filter(e => e.companyId === state.selectedCo)
                    : [];
                const selectedCo = state.companies.find(c => c.id === state.selectedCo);

                app.innerHTML = `
                    <div class="container">
                        <div class="header">
                            <h1>LEVORO Admin</h1>
                            <button class="btn" onclick="logout()">Logout</button>
                        </div>

                        <div class="grid">
                            <div class="card">
                                <h3>Companies (${state.companies.length})</h3>
                                ${state.companies.map(co => `
                                    <div class="item clickable ${state.selectedCo === co.id ? 'selected' : ''}" onclick="selectCo(${co.id})">
                                        <span><strong>${co.name}</strong><br><small>${state.employees.filter(e => e.companyId === co.id).length} employees</small></span>
                                        <button class="btn btn-danger" onclick="deleteCo(${co.id}); event.stopPropagation();">Delete</button>
                                    </div>
                                `).join('')}

                                <button class="btn" style="width: 100%;" onclick="document.getElementById('addCoForm').classList.toggle('hidden');">+ Add Company</button>
                                
                                <form id="addCoForm" class="form hidden" onsubmit="handleAddCompany(event)">
                                    <input type="text" id="coName" placeholder="Company name" required>
                                    <button type="submit" class="btn" style="width: 100%;">Add</button>
                                </form>
                            </div>

                            <div class="card">
                                <h3>${selectedCo ? selectedCo.name + ' - Employees' : 'Select a company'}</h3>
                                ${state.selectedCo ? `
                                    <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="document.getElementById('addEmpForm').classList.toggle('hidden');">+ Add Employee</button>
                                    
                                    <form id="addEmpForm" class="form hidden" onsubmit="handleAddEmployee(event)">
                                        <input type="text" id="empName" placeholder="Name *" required>
                                        <input type="text" id="empUser" placeholder="Username *" required>
                                        <input type="password" id="empPass" placeholder="Password *" required>
                                        <input type="email" id="empEmail" placeholder="Email">
                                        <input type="number" id="empRate" placeholder="Hourly Rate" step="0.01" value="15">
                                        <button type="submit" class="btn" style="width: 100%;">Add Employee</button>
                                    </form>

                                    <div>
                                        ${coEmps.map(emp => `
                                            <div class="item">
                                                <div>
                                                    <strong>${emp.name}</strong><br>
                                                    <small>@${emp.username} • $${emp.hourlyRate}/hr</small>
                                                </div>
                                                <button class="btn btn-danger" onclick="deleteEmp(${emp.id})">Delete</button>
                                            </div>
                                        `).join('')}
                                        ${coEmps.length === 0 ? '<p style="color: #999;">No employees yet</p>' : ''}
                                    </div>
                                ` : '<p style="color: #999;">Select a company to manage employees</p>'}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.user.role === 'employee') {
                app.innerHTML = `
                    <div class="container">
                        <div class="header">
                            <h1>Welcome, ${state.user.name}</h1>
                            <button class="btn" onclick="logout()">Logout</button>
                        </div>
                        <div class="card">
                            <p><strong>Username:</strong> ${state.user.username}</p>
                            <p><strong>Email:</strong> ${state.user.email || 'N/A'}</p>
                            <p><strong>Hourly Rate:</strong> $${state.user.hourlyRate}</p>
                        </div>
                    </div>
                `;
                return;
            }
        }

        load();
        render();
    </script>
</body>
</html>
