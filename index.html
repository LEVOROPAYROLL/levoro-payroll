<div id="app"></div>

<script>
    "use strict";

    /* =========================================
       APPLICATION STATE
    ========================================= */

    const STORAGE_KEY = "levoro";

    let db = {
        companies: [],
        employees: []
    };

    let currentUser = null;
    let selectedCompanyId = null;

    /* =========================================
       STORAGE
    ========================================= */

    function loadDB() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);

            if (saved) {
                const parsed = JSON.parse(saved);

                db = {
                    companies: Array.isArray(parsed.companies)
                        ? parsed.companies
                        : [],
                    employees: Array.isArray(parsed.employees)
                        ? parsed.employees
                        : []
                };
            }
        } catch (error) {
            console.error("Could not load database:", error);
            db = {
                companies: [],
                employees: []
            };
        }
    }

    function saveDB() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    /* =========================================
       HELPERS
    ========================================= */

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getInitials(name) {
        const words = String(name || "User")
            .trim()
            .split(/\s+/)
            .filter(Boolean);

        if (words.length === 1) {
            return words[0].substring(0, 2).toUpperCase();
        }

        return (
            words[0][0] +
            words[words.length - 1][0]
        ).toUpperCase();
    }

    function getCompany(id) {
        return db.companies.find(company => company.id === id);
    }

    function getCompanyEmployees(id) {
        return db.employees.filter(employee => employee.c === id);
    }

    /* =========================================
       AUTHENTICATION
    ========================================= */

    function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            alert("Please enter your username and password.");
            return;
        }

        if (username === "admin" && password === "admin123") {
            currentUser = {
                role: "admin",
                name: "Administrator"
            };

            selectedCompanyId = null;
            render();
            return;
        }

        const employee = db.employees.find(
            employee =>
                employee.u === username &&
                employee.p === password
        );

        if (employee) {
            currentUser = {
                ...employee,
                role: "employee"
            };

            selectedCompanyId = employee.c;
            render();
            return;
        }

        alert("Incorrect username or password.");
    }

    function logout() {
        currentUser = null;
        selectedCompanyId = null;
        render();
    }

    /* =========================================
       COMPANY MANAGEMENT
    ========================================= */

    function addCompany() {
        const name = prompt("Enter company name:");

        if (!name || !name.trim()) {
            return;
        }

        db.companies.push({
            id: Date.now(),
            name: name.trim()
        });

        saveDB();
        render();
    }

    function selectCompany(id) {
        selectedCompanyId = id;
        render();
    }

    function deleteCompany(id) {
        const company = getCompany(id);

        if (!company) return;

        const employeeCount = getCompanyEmployees(id).length;

        const message = employeeCount
            ? `Delete "${company.name}" and its ${employeeCount} employee(s)?`
            : `Delete "${company.name}"?`;

        if (!confirm(message)) {
            return;
        }

        db.companies = db.companies.filter(
            company => company.id !== id
        );

        db.employees = db.employees.filter(
            employee => employee.c !== id
        );

        if (selectedCompanyId === id) {
            selectedCompanyId = null;
        }

        saveDB();
        render();
    }

    /* =========================================
       EMPLOYEE MANAGEMENT
    ========================================= */

    function addEmployee() {
        if (!selectedCompanyId) {
            alert("Please select a company first.");
            return;
        }

        const name = prompt("Employee name:");
        if (!name || !name.trim()) return;

        const username = prompt("Username:");
        if (!username || !username.trim()) return;

        const existingUsername = db.employees.some(
            employee =>
                employee.u.toLowerCase() === username.trim().toLowerCase()
        );

        if (existingUsername) {
            alert("That username is already in use.");
            return;
        }

        const password = prompt("Password:");
        if (!password) return;

        const email = prompt("Email address:") || "";

        const rateInput = prompt(
            "Hourly rate:",
            "15.00"
        );

        const rate = parseFloat(rateInput);

        if (isNaN(rate) || rate < 0) {
            alert("Please enter a valid hourly rate.");
            return;
        }

        db.employees.push({
            id: Date.now(),
            name: name.trim(),
            u: username.trim(),
            p: password,
            email: email.trim(),
            rate,
            c: selectedCompanyId,
            role: "employee"
        });

        saveDB();

        alert(
            `Employee created successfully.\n\n` +
            `Username: ${username.trim()}\n` +
            `Password: ${password}`
        );

        render();
    }

    function deleteEmployee(id) {
        const employee = db.employees.find(
            employee => employee.id === id
        );

        if (!employee) return;

        if (!confirm(`Delete ${employee.name}?`)) {
            return;
        }

        db.employees = db.employees.filter(
            employee => employee.id !== id
        );

        saveDB();
        render();
    }

    /* =========================================
       LOGIN VIEW
    ========================================= */

    function renderLogin() {
        return `
            <div class="login-page">
                <div class="login-card">

                    <div class="brand">
                        <div class="brand-logo">L</div>
                        <h1>LEVORO</h1>
                        <p>Business Management Portal</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="username">
                            Username
                        </label>

                        <input
                            class="input"
                            id="username"
                            type="text"
                            placeholder="Enter username"
                            autocomplete="username"
                            onkeydown="if(event.key === 'Enter') login()"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">
                            Password
                        </label>

                        <input
                            class="input"
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            onkeydown="if(event.key === 'Enter') login()"
                        >
                    </div>

                    <button
                        class="btn btn-primary btn-full"
                        onclick="login()"
                    >
                        Sign In
                    </button>

                    <div class="login-demo">
                        Demo access: <strong>admin</strong> / <strong>admin123</strong>
                    </div>

                </div>
            </div>
        `;
    }

    /* =========================================
       TOP BAR
    ========================================= */

    function renderTopbar(title = "Management Portal") {
        return `
            <header class="topbar">

                <div class="topbar-brand">
                    <div class="mini-logo">L</div>
                    <span>LEVORO</span>
                </div>

                <div class="topbar-right">

                    <div class="user-badge">
                        <div class="avatar">
                            ${escapeHTML(getInitials(currentUser.name))}
                        </div>

                        ${escapeHTML(currentUser.name)}
                    </div>

                    <button
                        class="btn btn-secondary btn-small"
                        onclick="logout()"
                    >
                        Sign Out
                    </button>

                </div>
            </header>
        `;
    }

    /* =========================================
       ADMIN VIEW
    ========================================= */

    function renderAdmin() {
        const company = getCompany(selectedCompanyId);
        const employees = selectedCompanyId
            ? getCompanyEmployees(selectedCompanyId)
            : [];

        return `
            <div class="app-shell">

                ${renderTopbar()}

                <main class="dashboard">

                    <div class="page-heading">
                        <h1>Dashboard</h1>
                        <p>
                            Manage your companies and employees from one place.
                        </p>
                    </div>

                    <section class="stats">

                        <div class="stat-card">
                            <div class="stat-label">
                                Total Companies
                            </div>

                            <div class="stat-number">
                                ${db.companies.length}
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">
                                Total Employees
                            </div>

                            <div class="stat-number">
                                ${db.employees.length}
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">
                                Selected Company
                            </div>

                            <div
                                class="stat-number"
                                style="font-size:18px;"
                            >
                                ${company
                                    ? escapeHTML(company.name)
                                    : "None"
                                }
                            </div>
                        </div>

                    </section>

                    <section class="workspace">

                        <!-- Companies -->

                        <div class="card">

                            <div class="card-header">
                                <div class="card-header-row">

                                    <div>
                                        <h2 class="card-title">
                                            Companies
                                        </h2>

                                        <p class="card-subtitle">
                                            Select a company to manage employees.
                                        </p>
                                    </div>

                                    <button
                                        class="btn btn-primary btn-small"
                                        onclick="addCompany()"
                                    >
                                        + Add
                                    </button>

                                </div>
                            </div>

                            <div class="card-body">

                                ${
                                    db.companies.length === 0
                                    ? `
                                        <div class="empty-state">
                                            <div class="empty-icon">+</div>
                                            <strong>No companies yet</strong>
                                            <span>Add your first company to get started.</span>
                                        </div>
                                    `
                                    : `
                                        <div class="company-list">

                                            ${db.companies.map(company => {

                                                const count =
                                                    getCompanyEmployees(company.id).length;

                                                return `
                                                    <div
                                                        class="company-item ${
                                                            selectedCompanyId === company.id
                                                                ? "selected"
                                                                : ""
                                                        }"
                                                        onclick="selectCompany(${company.id})"
                                                    >

                                                        <div style="min-width:0;">
                                                            <div class="company-name">
                                                                ${escapeHTML(company.name)}
                                                            </div>

                                                            <div class="company-count">
                                                                ${count}
                                                                employee${count === 1 ? "" : "s"}
                                                            </div>
                                                        </div>

                                                        <div class="company-actions">

                                                            <button
                                                                class="btn btn-danger btn-small"
                                                                onclick="
                                                                    event.stopPropagation();
                                                                    deleteCompany(${company.id});
                                                                "
                                                                title="Delete company"
                                                            >
                                                                Delete
                                                            </button>

                                                        </div>

                                                    </div>
                                                `;
                                            }).join("")}

                                        </div>
                                    `
                                }

                            </div>
                        </div>

                        <!-- Employees -->

                        <div class="card">

                            <div class="card-header">

                                <div class="card-header-row">

                                    <div>
                                        <h2 class="card-title">
                                            ${
                                                company
                                                    ? escapeHTML(company.name)
                                                    : "Employee Management"
                                            }
                                        </h2>

                                        <p class="card-subtitle">
                                            ${
                                                company
                                                    ? "Manage employees assigned to this company."
                                                    : "Select a company to view employees."
                                            }
                                        </p>
                                    </div>

                                    ${
                                        company
                                        ? `
                                            <button
                                                class="btn btn-primary btn-small"
                                                onclick="addEmployee()"
                                            >
                                                + Add Employee
                                            </button>
                                        `
                                        : ""
                                    }

                                </div>

                            </div>

                            <div class="card-body">

                                ${
                                    !company
                                    ? `
                                        <div class="empty-state">
                                            <div class="empty-icon">⌂</div>
                                            <strong>Select a company</strong>
                                            <span>
                                                Choose a company from the left to manage employees.
                                            </span>
                                        </div>
                                    `
                                    : employees.length === 0
                                    ? `
                                        <div class="empty-state">
                                            <div class="empty-icon">+</div>
                                            <strong>No employees</strong>
                                            <span>
                                                Add an employee to this company to get started.
                                            </span>
                                        </div>
                                    `
                                    : `
                                        <div class="employee-list">

                                            ${employees.map(employee => `
                                                <div class="employee-item">

                                                    <div class="employee-main">

                                                        <div class="employee-avatar">
                                                            ${escapeHTML(
                                                                getInitials(employee.name)
                                                            )}
                                                        </div>

                                                        <div>
                                                            <div class="employee-name">
                                                                ${escapeHTML(employee.name)}
                                                            </div>

                                                            <div class="employee-meta">
                                                                @${escapeHTML(employee.u)}
                                                                &nbsp;•&nbsp;
                                                                $${Number(employee.rate).toFixed(2)}/hr
                                                                ${
                                                                    employee.email
                                                                        ? `&nbsp;•&nbsp; ${escapeHTML(employee.email)}`
                                                                        : ""
                                                                }
                                                            </div>
                                                        </div>

                                                    </div>

                                                    <button
                                                        class="btn btn-danger btn-small"
                                                        onclick="deleteEmployee(${employee.id})"
                                                    >
                                                        Delete
                                                    </button>

                                                </div>
                                            `).join("")}

                                        </div>
                                    `
                                }

                            </div>
                        </div>

                    </section>

                </main>
            </div>
        `;
    }

    /* =========================================
       EMPLOYEE VIEW
    ========================================= */

    function renderEmployee() {
        const company = getCompany(currentUser.c);

        return `
            <div class="app-shell">

                ${renderTopbar()}

                <main class="profile-wrapper">

                    <div class="profile-card">

                        <div class="profile-header">

                            <div class="profile-avatar">
                                ${escapeHTML(getInitials(currentUser.name))}
                            </div>

                            <h1>
                                Welcome, ${escapeHTML(currentUser.name)}
                            </h1>

                            <p>
                                ${company
                                    ? escapeHTML(company.name)
                                    : "Employee Profile"
                                }
                            </p>

                        </div>

                        <div class="profile-details">

                            <div class="detail">
                                <div class="detail-label">
                                    Username
                                </div>

                                <div class="detail-value">
                                    @${escapeHTML(currentUser.u)}
                                </div>
                            </div>

                            <div class="detail">
                                <div class="detail-label">
                                    Email
                                </div>

                                <div class="detail-value">
                                    ${currentUser.email
                                        ? escapeHTML(currentUser.email)
                                        : "Not provided"
                                    }
                                </div>
                            </div>

                            <div class="detail">
                                <div class="detail-label">
                                    Hourly Rate
                                </div>

                                <div class="detail-value">
                                    $${Number(currentUser.rate).toFixed(2)} / hour
                                </div>
                            </div>

                            <div class="detail">
                                <div class="detail-label">
                                    Company
                                </div>

                                <div class="detail-value">
                                    ${company
                                        ? escapeHTML(company.name)
                                        : "Not assigned"
                                    }
                                </div>
                            </div>

                        </div>

                        <div class="profile-footer">

                            <button
                                class="btn btn-secondary btn-full"
                                onclick="logout()"
                            >
                                Sign Out
                            </button>

                        </div>

                    </div>

                </main>

            </div>
        `;
    }

    /* =========================================
       RENDER APPLICATION
    ========================================= */

    function render() {
        const app = document.getElementById("app");

        if (!currentUser) {
            app.innerHTML = renderLogin();

            setTimeout(() => {
                document.getElementById("username")?.focus();
            }, 0);

            return;
        }

        if (currentUser.role === "admin") {
            app.innerHTML = renderAdmin();
            return;
        }

        if (currentUser.role === "employee") {
            app.innerHTML = renderEmployee();
            return;
        }

        currentUser = null;
        app.innerHTML = renderLogin();
    }

    /* =========================================
       START APPLICATION
    ========================================= */

    loadDB();
    render();
</script>

</body>
</html>
