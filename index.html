<!DOCTYPE html>
<html>
<head>
    <title>LEVORO</title>
    <style>
        body { font-family: Arial; background: #4c63d2; padding: 20px; margin: 0; }
        .box { background: white; max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 8px; }
        h1 { text-align: center; color: #3b5bdb; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #3b5bdb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button:hover { background: #2c4ab0; }
        p { text-align: center; font-size: 12px; color: #666; margin-top: 15px; }
        .panel { background: white; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 1000px; }
        .item { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .item:hover { background: #e8e8e8; }
        .item-selected { background: #e3f2fd !important; }
        h2 { color: white; text-align: center; margin: 20px 0; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .emp-info { background: white; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 1000px; text-align: center; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        let db = {
            companies: [],
            employees: []
        };
        let user = null;
        let selectedCo = null;

        function loadDB() {
            const saved = localStorage.getItem('levoro');
            if (saved) {
                db = JSON.parse(saved);
            }
        }

        function saveDB() {
            localStorage.setItem('levoro', JSON.stringify(db));
        }

        function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            
            if (u === 'admin' && p === 'admin123') {
                user = { role: 'admin', name: 'Admin' };
                show();
                return;
            }
            
            const emp = db.employees.find(e => e.u === u && e.p === p);
            if (emp) {
                user = emp;
                user.role = 'employee';
                selectedCo = emp.c;
                show();
                return;
            }
            
            alert('Wrong username or password!');
        }

        function logout() {
            user = null;
            selectedCo = null;
            document.getElementById('u').value = 'admin';
            document.getElementById('p').value = 'admin123';
            show();
        }

        function addCo() {
            const name = prompt('Company name:');
            if (name) {
                db.companies.push({ id: Date.now(), name: name });
                saveDB();
                show();
            }
        }

        function selectCo(id) {
            selectedCo = id;
            show();
        }

        function addEmp() {
            const n = prompt('Name:');
            if (!n) return;
            const u = prompt('Username:');
            if (!u) return;
            const p = prompt('Password:');
            if (!p) return;
            const e = prompt('Email:');
            const r = prompt('Rate (default 15):', '15');
            
            db.employees.push({
                id: Date.now(),
                name: n,
                u: u,
                p: p,
                email: e,
                rate: parseFloat(r),
                c: selectedCo,
                role: 'employee'
            });
            saveDB();
            alert('Employee added!\nUsername: ' + u + '\nPassword: ' + p);
            show();
        }

        function delCo(id) {
            db.companies = db.companies.filter(c => c.id !== id);
            db.employees = db.employees.filter(e => e.c !== id);
            if (selectedCo === id) selectedCo = null;
            saveDB();
            show();
        }

        function delEmp(id) {
            db.employees = db.employees.filter(e => e.id !== id);
            saveDB();
            show();
        }

        function show() {
            const app = document.getElementById('app');
            
            // LOGIN PAGE
            if (!user) {
                app.innerHTML = `
                    <div class="box">
                        <h1>LEVORO</h1>
                        <input type="text" id="u" placeholder="Username" value="admin">
                        <input type="password" id="p" placeholder="Password" value="admin123">
                        <button onclick="login()">Login</button>
                        <p>Demo: admin / admin123</p>
                    </div>
                `;
                return;
            }

            // ADMIN PAGE
            if (user.role === 'admin') {
                const co = db.companies.find(c => c.id === selectedCo);
                const emps = selectedCo ? db.employees.filter(e => e.c === selectedCo) : [];
                
                app.innerHTML = `
                    <h2>LEVORO Admin <button style="width: auto; padding: 8px 16px; margin: 0;" onclick="logout()">Logout</button></h2>
                    <div class="grid">
                        <div class="panel">
                            <h3 style="margin-top: 0; color: #3b5bdb;">Companies (${db.companies.length})</h3>
                            ${db.companies.map(c => `
                                <div class="item ${selectedCo === c.id ? 'item-selected' : ''}" onclick="selectCo(${c.id})">
                                    <span><strong>${c.name}</strong></span>
                                    <button onclick="delCo(${c.id}); event.stopPropagation();" style="width: auto; padding: 4px 8px; font-size: 12px; background: #dc3545;">Delete</button>
                                </div>
                            `).join('')}
                            <button onclick="addCo()" style="margin-top: 15px;">+ Add Company</button>
                        </div>

                        <div class="panel">
                            <h3 style="margin-top: 0; color: #3b5bdb;">${co ? co.name : 'Select company'}</h3>
                            ${selectedCo ? `
                                <button onclick="addEmp()" style="margin-bottom: 15px;">+ Add Employee</button>
                                ${emps.length === 0 ? '<p style="color: #999;">No employees</p>' : ''}
                                ${emps.map(e => `
                                    <div class="item">
                                        <div><strong>${e.name}</strong><br><small>@${e.u} • $${e.rate}/hr</small></div>
                                        <button onclick="delEmp(${e.id})" style="width: auto; padding: 4px 8px; font-size: 12px; background: #dc3545;">Delete</button>
                                    </div>
                                `).join('')}
                            ` : '<p style="color: #999;">Select a company to add employees</p>'}
                        </div>
                    </div>
                `;
                return;
            }

            // EMPLOYEE PAGE
            if (user.role === 'employee') {
                app.innerHTML = `
                    <div class="emp-info">
                        <h1 style="color: #3b5bdb; margin: 0 0 20px 0;">Welcome ${user.name}</h1>
                        <p><strong>Username:</strong> ${user.u}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Hourly Rate:</strong> $${user.rate}/hr</p>
                        <button onclick="logout()" style="width: auto; padding: 10px 20px; margin-top: 20px;">Logout</button>
                    </div>
                `;
                return;
            }
        }

        loadDB();
        show();
    </script>
</body>
</html>
