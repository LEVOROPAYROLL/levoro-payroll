<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVORO | Payroll & Time Tracking</title>

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --dark: #111827;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f5f7fb;
    --white: #fff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warning: #d97706;
    --warning-bg: #fffbeb;
    --sidebar: #111827;
    --sidebar-hover: #1f2937;
    --radius: 12px;
    --shadow: 0 4px 18px rgba(15,23,42,.06);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top left, rgba(37,99,235,.22), transparent 35%),
        linear-gradient(135deg,#0f172a,#172554);
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 42px;
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-mark {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 14px;
    border-radius: 16px;
    background: var(--primary);
    color: white;
    font-weight: 800;
    font-size: 25px;
}

.logo h1 {
    margin: 0;
    letter-spacing: 3px;
    font-size: 29px;
}

.logo p {
    color: var(--muted);
    margin: 7px 0 0;
    font-size: 13px;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 650;
}

.input,
select,
textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    background: white;
    color: var(--text);
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.input:focus,
select:focus,
textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.demo-box {
    margin-top: 18px;
    padding: 12px;
    border-radius: 9px;
    background: #f8fafc;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

/* BUTTONS */

.btn {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    font-weight: 650;
    font-size: 13px;
    transition: .15s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #f3f4f6;
    color: #374151;
}

.btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-warning {
    background: var(--warning-bg);
    color: var(--warning);
}

.btn-sm {
    padding: 7px 10px;
    font-size: 11px;
}

.btn-block {
    width: 100%;
}

/* APP */

.app {
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: 245px;
    flex-shrink: 0;
    background: var(--sidebar);
    color: white;
    min-height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 20;
}

.sidebar-brand {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 22px;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.sidebar-brand-mark {
    width: 35px;
    height: 35px;
    border-radius: 9px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
}

.sidebar-brand span {
    font-weight: 800;
    letter-spacing: 2px;
}

.nav {
    padding: 18px 12px;
}

.nav-section {
    color: #6b7280;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px;
    font-weight: 700;
}

.nav-item {
    width: 100%;
    border: 0;
    background: transparent;
    color: #d1d5db;
    text-align: left;
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 3px;
    font-size: 13px;
}

.nav-item:hover,
.nav-item.active {
    background: var(--sidebar-hover);
    color: white;
}

.nav-icon {
    width: 24px;
    display: inline-block;
}

.main {
    margin-left: 245px;
    width: calc(100% - 245px);
}

.topbar {
    height: 72px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.topbar-title {
    font-size: 18px;
    font-weight: 750;
}

.topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12px;
}

.content {
    padding: 28px;
    max-width: 1500px;
    margin: auto;
}

/* CARDS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 16px;
    margin-bottom: 22px;
}

.stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
}

.stat-value {
    font-size: 27px;
    font-weight: 800;
    margin-top: 7px;
}

.stat-note {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
}

.card-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.card-title {
    font-weight: 750;
    font-size: 15px;
}

.card-subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.card-body {
    padding: 20px;
}

/* GRID */

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
}

.admin-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
}

/* COMPANY LIST */

.company-item {
    padding: 13px;
    background: #f8fafc;
    border: 1px solid transparent;
    border-radius: 9px;
    margin-bottom: 7px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.company-item:hover {
    background: #f1f5f9;
}

.company-item.active {
    background: var(--primary-light);
    border-color: #bfdbfe;
}

.company-name {
    font-weight: 700;
    font-size: 13px;
}

.company-meta {
    color: var(--muted);
    font-size: 10px;
    margin-top: 4px;
}

/* TABLE */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f8fafc;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
    text-align: left;
    padding: 11px 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}

td {
    padding: 13px;
    border-bottom: 1px solid #f0f1f3;
    font-size: 12px;
    vertical-align: middle;
}

tr:hover td {
    background: #fafafa;
}

.actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

/* BADGES */

.badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
}

.badge-pending {
    background: var(--warning-bg);
    color: var(--warning);
}

.badge-approved {
    background: var(--success-bg);
    color: var(--success);
}

.badge-rejected {
    background: var(--danger-bg);
    color: var(--danger);
}

.badge-admin {
    background: #ede9fe;
    color: #7c3aed;
}

.badge-manager {
    background: #e0f2fe;
    color: #0369a1;
}

.badge-employee {
    background: #f3f4f6;
    color: #4b5563;
}

/* FILTERS */

.filters {
    display: flex;
    align-items: end;
    gap: 12px;
    flex-wrap: wrap;
}

.filter-item {
    min-width: 170px;
}

.filter-item label {
    font-size: 11px;
}

.filter-item input,
.filter-item select {
    height: 39px;
}

/* EMPLOYEE PROFILE */

.profile-header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.profile-avatar {
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
}

.profile-name {
    font-size: 20px;
    font-weight: 800;
}

.profile-company {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

/* CLOCK */

.clock-card {
    text-align: center;
    padding: 35px 20px;
}

.current-time {
    font-size: 38px;
    font-weight: 800;
    margin: 10px 0;
}

.current-date {
    color: var(--muted);
    font-size: 13px;
}

.clock-status {
    margin: 20px 0;
    padding: 12px;
    border-radius: 9px;
    background: #f8fafc;
    font-size: 12px;
}

/* EMPTY */

.empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
}

.empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 5px;
}

/* MODAL */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    background: white;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 15px;
    box-shadow: 0 30px 80px rgba(0,0,0,.25);
}

.modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
}

.modal-body {
    padding: 20px;
}

.modal-footer {
    padding: 15px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.full {
    grid-column: 1 / -1;
}

/* MOBILE */

@media(max-width:1050px) {
    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .admin-grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:800px) {
    .sidebar {
        width: 65px;
    }

    .sidebar-brand {
        justify-content: center;
        padding: 0;
    }

    .sidebar-brand span,
    .nav-item span:not(.nav-icon),
    .nav-section {
        display: none;
    }

    .nav-item {
        text-align: center;
        padding: 12px 5px;
    }

    .nav-icon {
        width: auto;
    }

    .main {
        margin-left: 65px;
        width: calc(100% - 65px);
    }

    .grid-2,
    .grid-3 {
        grid-template-columns: 1fr;
    }
}

@media(max-width:600px) {
    .content {
        padding: 15px;
    }

    .topbar {
        padding: 0 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .topbar-user-name {
        display: none;
    }
}

/* PRINT */

@media print {
    .sidebar,
    .topbar,
    .no-print,
    .btn,
    .filters {
        display: none !important;
    }

    .main {
        margin: 0;
        width: 100%;
    }

    .content {
        padding: 0;
        max-width: none;
    }

    .card {
        border: 0;
        box-shadow: none;
    }

    body {
        background: white;
    }

    .print-title {
        display: block !important;
    }
}

.print-title {
    display: none;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* ============================================================
   LEVORO DATABASE
============================================================ */

const STORAGE_KEY = "LEVORO_ENTERPRISE_V1";

let db = {
    companies: [],
    users: [],
    timesheets: [],
    paystubs: [],
    activity: []
};

let currentUser = null;
let currentPage = "dashboard";
let selectedCompanyId = null;

/* ============================================================
   STORAGE
============================================================ */

function saveDB() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function loadDB() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        try {
            db = JSON.parse(saved);
        } catch {
            createDemoData();
        }
    } else {
        createDemoData();
    }
}

/* ============================================================
   DEMO DATA
============================================================ */

function createDemoData() {

    const company1 = {
        id: 1001,
        name: "Milano Pizza",
        createdAt: new Date().toISOString()
    };

    const company2 = {
        id: 1002,
        name: "Ottawa Catering",
        createdAt: new Date().toISOString()
    };

    db.companies = [company1, company2];

    db.users = [
        {
            id: 1,
            name: "Admin",
            username: "admin",
            password: "admin123",
            email: "admin@levoro.com",
            phone: "",
            address: "",
            role: "ADMIN",
            companyId: null,
            hourlyRate: 0
        },
        {
            id: 2,
            name: "John Manager",
            username: "manager",
            password: "manager123",
            email: "manager@milano.com",
            phone: "613-555-1111",
            address: "Ottawa, ON",
            role: "MANAGER",
            companyId: 1001,
            hourlyRate: 0
        },
        {
            id: 3,
            name: "John Smith",
            username: "employee",
            password: "employee123",
            email: "john@email.com",
            phone: "613-555-2222",
            address: "Ottawa, ON",
            role: "EMPLOYEE",
            companyId: 1001,
            hourlyRate: 18.50
        },
        {
            id: 4,
            name: "Sarah Brown",
            username: "sarah",
            password: "sarah123",
            email: "sarah@email.com",
            phone: "613-555-3333",
            address: "Ottawa, ON",
            role: "EMPLOYEE",
            companyId: 1001,
            hourlyRate: 20
        },
        {
            id: 5,
            name: "Michael Lee",
            username: "michael",
            password: "michael123",
            email: "michael@email.com",
            phone: "613-555-4444",
            address: "Ottawa, ON",
            role: "EMPLOYEE",
            companyId: 1002,
            hourlyRate: 17.50
        }
    ];

    db.timesheets = [];

    db.paystubs = [];

    db.activity = [];

    saveDB();
}

/* ============================================================
   HELPERS
============================================================ */

function uid() {
    return Date.now() + Math.floor(Math.random() * 10000);
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function initials(name) {
    const parts = String(name || "User").trim().split(/\s+/);

    if (parts.length === 1)
        return parts[0].substring(0,2).toUpperCase();

    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function money(value) {
    return "$" + Number(value || 0).toFixed(2);
}

function companyName(id) {
    const c = db.companies.find(x => x.id == id);
    return c ? c.name : "—";
}

function userName(id) {
    const u = db.users.find(x => x.id == id);
    return u ? u.name : "System";
}

function formatDate(date) {
    return new Date(date).toLocaleDateString("en-CA", {
        year: "numeric",
        month: "short",
        day: "numeric"
    });
}

function formatDateTime(date) {
    return new Date(date).toLocaleString("en-CA", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });
}

function todayISO() {
    return new Date().toISOString().split("T")[0];
}

function statusBadge(status) {

    const cls = {
        PENDING: "badge-pending",
        APPROVED: "badge-approved",
        REJECTED: "badge-rejected"
    }[status] || "badge-pending";

    return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
}

function roleBadge(role) {

    const cls = {
        ADMIN: "badge-admin",
        MANAGER: "badge-manager",
        EMPLOYEE: "badge-employee"
    }[role] || "badge-employee";

    return `<span class="badge ${cls}">${escapeHTML(role)}</span>`;
}

/* ============================================================
   ACTIVITY LOG
============================================================ */

function logActivity(action, description) {

    db.activity.unshift({
        id: uid(),
        action,
        description,
        userId: currentUser ? currentUser.id : null,
        userName: currentUser ? currentUser.name : "System",
        userRole: currentUser ? currentUser.role : "SYSTEM",
        companyId: currentUser ? currentUser.companyId : null,
        companyName: currentUser
            ? companyName(currentUser.companyId)
            : "",
        timestamp: new Date().toISOString()
    });

    saveDB();
}

/* ============================================================
   AUTH
============================================================ */

function login() {

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    const user = db.users.find(
        u => u.username.toLowerCase() === username.toLowerCase()
        && u.password === password
    );

    if (!user) {
        alert("Incorrect username or password.");
        return;
    }

    currentUser = user;

    if (user.role === "ADMIN") {
        currentPage = "dashboard";
    } else if (user.role === "MANAGER") {
        currentPage = "dashboard";
        selectedCompanyId = user.companyId;
    } else {
        currentPage = "dashboard";
    }

    logActivity(
        "LOGIN",
        `${user.name} logged into the system`
    );

    render();
}

function logout() {

    if (currentUser) {
        logActivity(
            "LOGOUT",
            `${currentUser.name} logged out of the system`
        );
    }

    currentUser = null;
    selectedCompanyId = null;
    currentPage = "dashboard";

    render();
}

/* ============================================================
   LOGIN SCREEN
============================================================ */

function renderLogin() {

    return `
        <div class="login-screen">

            <div class="login-card">

                <div class="logo">
                    <div class="logo-mark">L</div>
                    <h1>LEVORO</h1>
                    <p>Payroll & Time Tracking</p>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input
                        id="loginUsername"
                        class="input"
                        placeholder="Enter username"
                        autocomplete="username"
                        onkeydown="if(event.key==='Enter') login()"
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        id="loginPassword"
                        class="input"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        onkeydown="if(event.key==='Enter') login()"
                    >
                </div>

                <button
                    class="btn btn-primary btn-block"
                    onclick="login()"
                >
                    Sign In
                </button>

                <div class="demo-box">
                    <strong>Demo Accounts</strong><br>
                    Admin: admin / admin123<br>
                    Manager: manager / manager123<br>
                    Employee: employee / employee123
                </div>

            </div>

        </div>
    `;
}

/* ============================================================
   SIDEBAR
============================================================ */

function navigation() {

    if (currentUser.role === "ADMIN") {

        return `
            <div class="nav-section">Management</div>

            ${nav("dashboard","▦","Dashboard")}
            ${nav("companies","▣","Companies")}
            ${nav("employees","♙","Employees")}
            ${nav("managers","♟","Managers")}

            <div class="nav-section">Payroll</div>

            ${nav("timesheets","◷","Timesheets")}
            ${nav("payroll","$","Payroll")}
            ${nav("reports","▤","Reports")}

            <div class="nav-section">System</div>

            ${nav("activity","◉","Activity Log")}
        `;

    }

    if (currentUser.role === "MANAGER") {

        return `
            <div class="nav-section">Management</div>

function clockCard() {

    const today = todayISO();

    const openShift =
        db.timesheets.find(
            t => t.employeeId === currentUser.id
            && t.workDate === today
            && t.startTime
            && !t.endTime
        );

    return `
        <div class="card clock-card">

            <div style="font-size:12px;color:#6b7280;">
                ${formatDate(new Date())}
            </div>

            <div
                id="liveClock"
                class="current-time"
            >
                ${new Date().toLocaleTimeString([], {
                    hour:"numeric",
                    minute:"2-digit",
                    second:"2-digit"
                })}
            </div>

            <div class="clock-status">

                ${
                    openShift
                    ? `
                        <strong style="color:#16a34a;">
                            ● Currently Working
                        </strong>

                        <div style="margin-top:5px;">
                            Started at
                            ${new Date(openShift.startTime)
                                .toLocaleTimeString([],{
                                    hour:"numeric",
                                    minute:"2-digit"
                                })}
                        </div>
                    `
                    : `
                        You are currently off duty.
                    `
                }

            </div>

            ${
                openShift
                ? `
                    <button
                        class="btn btn-danger"
                        onclick="clockOut()"
                    >
                        End Work
                    </button>
                `
                : `
                    <button
                        class="btn btn-primary"
                        onclick="clockIn()"
                    >
                        Start Work
                    </button>
                `
            }

        </div>
    `;
}

function clockIn() {

    const now = new Date();

    db.timesheets.push({
        id: uid(),
        employeeId: currentUser.id,
        companyId: currentUser.companyId,
        workDate: todayISO(),
        startTime: now.toISOString(),
        endTime: null,
        totalHours: 0,
        status: "PENDING",
        approvedBy: null,
        approvedAt: null
    });

    logActivity(
        "CLOCK_IN",
        `${currentUser.name} started work`
    );

    render();
}

function clockOut() {

    const now = new Date();

    const shift =
        db.timesheets.find(
            t => t.employeeId === currentUser.id
            && t.workDate === todayISO()
            && t.startTime
            && !t.endTime
        );

    if (!shift) return;

    shift.endTime = now.toISOString();

    const start = new Date(shift.startTime);
    const end = new Date(shift.endTime);

    shift.totalHours =
        Math.max(
            0,
            (end - start) / 3600000
        );

    saveDB();

    logActivity(
        "CLOCK_OUT",
        `${currentUser.name} ended work (${shift.totalHours.toFixed(2)} hours)`
    );

    render();
}

function renderEmployeeTimesheetTable(records) {
    return renderTimesheetTable(records);
}

function filterTimesheets() {

    const from = document.getElementById("tsFrom").value;
    const to = document.getElementById("tsTo").value;

    let records = db.timesheets.filter(t => {

        if (
            currentUser.role !== "ADMIN"
            && t.companyId !== currentUser.companyId
        ) return false;

        if (from && t.workDate < from) return false;
        if (to && t.workDate > to) return false;

        return true;
    });

    document.getElementById("timesheetTable").innerHTML =
        renderTimesheetTable(records);
}

function approveTimesheet(id) {

    const t = db.timesheets.find(x => x.id === id);

    if (!t) return;

    t.status = "APPROVED";
    t.approvedBy = currentUser.id;
    t.approvedAt = new Date().toISOString();

    saveDB();

    const employee = db.users.find(
        u => u.id === t.employeeId
    );

    logActivity(
        "APPROVE_TIMESHEET",
        `${currentUser.name} approved ${employee?.name}'s timesheet for ${t.workDate}`
    );

    render();
}

function rejectTimesheet(id) {

    const t = db.timesheets.find(x => x.id === id);

    if (!t) return;

    t.status = "REJECTED";

    saveDB();

    const employee = db.users.find(
        u => u.id === t.employeeId
    );

    logActivity(
        "REJECT_TIMESHEET",
        `${currentUser.name} rejected ${employee?.name}'s timesheet for ${t.workDate}`
    );

    render();
}

        );

    records.forEach(t => {

        if (!grouped[t.employeeId]) {

                employeeId: t.employeeId,
                hours: 0
            };
        }

        grouped[t.employeeId].hours +=
            Number(t.totalHours || 0);
    });

    const rows = Object.values(grouped);

    const totalHours =
        rows.reduce((sum,r) => sum + r.hours,0);

    const totalPay =
        rows.reduce((sum,r) => {

            const employee =
                db.users.find(u => u.id === r.employeeId);

            return sum +
                r.hours *
                Number(employee?.hourlyRate || 0);

        },0);

    return `

function approvePaystub(employeeId,hours,grossPay) {

    const employee =
        db.users.find(u => u.id === employeeId);

    if (!employee) return;

    db.paystubs.push({
        id: uid(),
        employeeId,
        companyId: employee.companyId,
        payPeriodStart: todayISO(),
        payPeriodEnd: todayISO(),
        totalHours: hours,
        hourlyRate: employee.hourlyRate,
        grossPay,
        status: "APPROVED",
        approvedBy: currentUser.id,
        approvedAt: new Date().toISOString()
    });

    saveDB();

    logActivity(
        "APPROVE_PAYSTUB",
        `${currentUser.name} approved paystub for ${employee.name} (${money(grossPay)})`
    );

    render();
}

function exportPayrollCSV() {

    let records = db.timesheets.filter(
        t => t.status === "APPROVED"
    );

    if (currentUser.role !== "ADMIN") {
        records = records.filter(
            t => t.companyId === currentUser.companyId
        );
    }

    const rows = [[
        "Employee Name",
        "Username",
        "Company",
        "Date",
        "Hours",
        "Hourly Rate",
        "Gross Pay",
        "Status"
    ]];

    records.forEach(t => {

        const employee =
            db.users.find(
                u => u.id === t.employeeId
            );

        const gross =
            Number(t.totalHours || 0) *
            Number(employee?.hourlyRate || 0);

        rows.push([
            employee?.name || "",
            employee?.username || "",
            companyName(t.companyId),
            t.workDate,
            Number(t.totalHours || 0).toFixed(2),
            Number(employee?.hourlyRate || 0).toFixed(2),
            gross.toFixed(2),
            "APPROVED"
        ]);
    });

    const csv = rows
        .map(row =>
            row.map(value =>
                `"${String(value).replace(/"/g,'""')}"`
            ).join(",")
        )
        .join("\n");

    const blob =
        new Blob([csv],{type:"text/csv;charset=utf-8;"});

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download =
        `LEVORO_Payroll_${todayISO()}.csv`;

    link.click();

    URL.revokeObjectURL(url);

    logActivity(
        "EXPORT_PAYROLL",
        `${currentUser.name} exported payroll CSV`
    );
}

                        </td>

                                Try another date range.
                            </div>
                        </td>
                    </tr>

    `;
}

function filterActivity() {

    const from =
        document.getElementById("activityFrom").value;

    const to =
        document.getElementById("activityTo").value;

    let records = db.activity.filter(a => {

        const date =
            new Date(a.timestamp)
                .toISOString()
                .split("T")[0];

        if (from && date < from) return false;
        if (to && date > to) return false;

        return true;
    });

    document.getElementById("activityTable").innerHTML =
        renderActivityTable(records);
}

function clearActivityFilter() {

    document.getElementById("activityFrom").value = "";
    document.getElementById("activityTo").value = "";

    document.getElementById("activityTable").innerHTML =
        renderActivityTable(db.activity);
}

function saveUser(role,id) {

    const name =
        document.getElementById("userName").value.trim();

    const username =
        document.getElementById("userUsername").value.trim();

    const password =
        document.getElementById("userPassword").value;

    const email =
        document.getElementById("userEmail").value.trim();

    const phone =
        document.getElementById("userPhone").value.trim();

    const address =
        document.getElementById("userAddress").value.trim();

    const companyId =
        Number(document.getElementById("userCompany").value);

    const rate =
        Number(document.getElementById("userRate").value || 0);

    if (!name || !username || !companyId) {
        alert("Please complete all required fields.");
        return;
    }

    if (!id && !password) {
        alert("Password is required.");
        return;
    }

    const duplicate =
        db.users.find(
            u =>
            u.username.toLowerCase() === username.toLowerCase()
            && u.id !== id
        );

    if (duplicate) {
        alert("That username is already in use.");
        return;
    }

    if (id) {

        const user =
            db.users.find(u => u.id === id);

        if (!user) return;

        user.name = name;
        user.username = username;
        user.email = email;
        user.phone = phone;
        user.address = address;
        user.companyId = companyId;

        if (password)
            user.password = password;

        if (role === "EMPLOYEE")
            user.hourlyRate = rate;

        saveDB();

        logActivity(
            role === "EMPLOYEE"
                ? "UPDATE_EMPLOYEE"
                : "UPDATE_MANAGER",
            `${currentUser.name} updated ${role.toLowerCase()} ${name}`
        );

    } else {

        const newUser = {
            id: uid(),
            name,
            username,
            password,
            email,
            phone,
            address,
            role,
            companyId,
            hourlyRate:
                role === "EMPLOYEE"
                ? rate
                : 0
        };

        db.users.push(newUser);

        saveDB();

        logActivity(
            role === "EMPLOYEE"
                ? "CREATE_EMPLOYEE"
                : "CREATE_MANAGER",
            `${currentUser.name} created ${role.toLowerCase()} ${name}`
        );
    }

    closeModal();
    render();
}

function deleteUser(id) {

    const user =
        db.users.find(u => u.id === id);

    if (!user) return;

    if (
        !confirm(
            `Delete ${user.name}?\n\nThis action cannot be undone.`
        )
    ) return;

    db.users =
        db.users.filter(u => u.id !== id);

    saveDB();

    logActivity(
        user.role === "EMPLOYEE"
            ? "DELETE_EMPLOYEE"
            : "DELETE_MANAGER",
        `${currentUser.name} deleted ${user.role.toLowerCase()} ${user.name}`
    );

    render();
}

                title = "Managers";
                content = managersPage();
                break;

            case "timesheets":
                title = "Timesheets";
                content = timesheetsPage();
                break;

            case "payroll":
                title = "Payroll";
                content = payrollPage();
                break;

            case "reports":
                title = "Reports";
                content = reportsPage();
                break;

            case "activity":
                title = "Activity Log";
                content = activityPage();
                break;

            default:
                title = "Admin Dashboard";
                content = adminDashboard();
        }

    } else if (currentUser.role === "MANAGER") {

        switch(currentPage) {

            case "employees":
                title = "Employees";
                content = employeesPage();
                break;

            case "timesheets":
                title = "Timesheet Approval";
                content = timesheetsPage();
                break;

            case "payroll":
                title = "Payroll";
                content = payrollPage();
                break;

            case "reports":
                title = "Reports";
                content = reportsPage();
                break;

            default:
                title = "Manager Dashboard";
                content = managerDashboard();
        }

    } else {

        switch(currentPage) {

            case "clock":
                title = "Time Clock";
                content = clockCard();
                break;

            case "timesheets":
                title = "My Timesheets";
                content = timesheetsPage();
                break;

            case "profile":
                title = "My Profile";
                content = profilePage();
                break;

            default:
                title = "Employee Dashboard";
                content = employeeDashboard();
        }
    }

    app.innerHTML =
        renderApp(content,title);

    startClock();
}

/* ============================================================
   LIVE CLOCK
============================================================ */

let clockInterval = null;

function startClock() {

    if (clockInterval)
        clearInterval(clockInterval);

    clockInterval =
        setInterval(() => {

            const clock =
                document.getElementById("liveClock");

            if (clock) {

                clock.textContent =
                    new Date().toLocaleTimeString([],{
                        hour:"numeric",
                        minute:"2-digit",
                        second:"2-digit"
                    });
            }

        },1000);
}
