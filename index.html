<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVORO — Payroll & Time Tracking</title>

<style>
:root {
    --primary: #3157d5;
    --primary-dark: #2444b5;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #172033;
    --muted: #697386;
    --border: #e4e8f0;
    --success: #198754;
    --warning: #d98c00;
    --danger: #dc3545;
    --info: #0d6efd;
    --shadow: 0 8px 30px rgba(25, 35, 60, .07);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at top left, rgba(49,87,213,.22), transparent 35%),
        linear-gradient(135deg, #101936, #3157d5);
    padding: 24px;
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 18px;
    padding: 42px;
    box-shadow: 0 25px 70px rgba(0,0,0,.22);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--primary);
    margin-bottom: 8px;
}

.login-subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-control {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 13px;
    outline: none;
    background: #fff;
    transition: .2s;
}

.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(49,87,213,.1);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 80px;
}

.password-toggle {
    position: absolute;
    right: 10px;
    top: 7px;
    border: 0;
    background: transparent;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
}

.btn {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    font-weight: 700;
    transition: .2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #eef1f7;
    color: #344054;
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.btn-warning {
    background: #f4b400;
    color: #1f2937;
}

.btn-small {
    padding: 7px 10px;
    font-size: 12px;
}

.full {
    width: 100%;
}

.login-error {
    color: var(--danger);
    background: #fff0f1;
    border: 1px solid #ffd2d6;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 13px;
}

/* APP */

.app-shell {
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: 250px;
    background: #111a35;
    color: white;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    padding: 24px 16px;
    z-index: 10;
}

.sidebar-logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 3px;
    padding: 0 12px 30px;
}

.sidebar-user {
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
}

.sidebar-user strong {
    display: block;
}

.sidebar-user span {
    font-size: 12px;
    color: #aeb8d4;
}

.nav-item {
    width: 100%;
    background: transparent;
    border: 0;
    color: #cbd3e8;
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    margin-bottom: 4px;
}

.nav-item:hover,
.nav-item.active {
    background: rgba(255,255,255,.1);
    color: white;
}

.main {
    margin-left: 250px;
    width: calc(100% - 250px);
}

.topbar {
    height: 72px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

.page-title {
    font-size: 20px;
    font-weight: 800;
}

.content {
    padding: 30px;
    max-width: 1500px;
    margin: auto;
}

/* CARDS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow);
}

.stat-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.card-title {
    font-size: 17px;
    font-weight: 800;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.company-layout {
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 20px;
}

.company-list-item {
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 9px;
    margin-bottom: 8px;
    cursor: pointer;
}

.company-list-item:hover,
.company-list-item.selected {
    border-color: var(--primary);
    background: #f4f7ff;
}

.company-name {
    font-weight: 700;
}

.company-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    text-align: left;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    background: #f8f9fc;
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

td {
    padding: 13px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

tr:last-child td {
    border-bottom: 0;
}

/* BADGES */

.badge {
    display: inline-block;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 800;
}

.badge-open {
    background: #e9f2ff;
    color: #1769aa;
}

.badge-submitted {
    background: #fff3cd;
    color: #8a6500;
}

.badge-approved {
    background: #dff6e7;
    color: #14783f;
}

.badge-issued {
    background: #e8ddff;
    color: #6338a8;
}

.badge-closed {
    background: #e8eaee;
    color: #4b5563;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,18,40,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    background: white;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 15px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-title {
    font-size: 20px;
    font-weight: 800;
}

.close {
    border: 0;
    background: #f0f2f6;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 18px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

/* CLOCK */

.clock-card {
    text-align: center;
    padding: 35px;
}

.clock-time {
    font-size: 46px;
    font-weight: 800;
    margin: 10px 0;
}

.clock-date {
    color: var(--muted);
    margin-bottom: 25px;
}

.clock-button {
    min-width: 200px;
    padding: 15px 25px;
    font-size: 16px;
}

/* PAYSTUB */

.paystub {
    max-width: 800px;
    margin: auto;
    border: 1px solid #ddd;
    padding: 35px;
    background: white;
}

.paystub-header {
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid #222;
    padding-bottom: 20px;
    margin-bottom: 25px;
}

.paystub-logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
}

.paystub-total {
    font-size: 28px;
    font-weight: 900;
}

/* EMPTY */

.empty {
    text-align: center;
    color: var(--muted);
    padding: 35px 15px;
}

/* RESPONSIVE */

@media (max-width: 1000px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .company-layout,
    .grid-2,
    .grid-3 {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 700px) {
    .sidebar {
        width: 70px;
        padding: 15px 8px;
    }

    .sidebar-logo {
        font-size: 15px;
        padding: 10px 3px 20px;
    }

    .sidebar-user,
    .nav-item span {
        display: none;
    }

    .main {
        margin-left: 70px;
        width: calc(100% - 70px);
    }

    .content {
        padding: 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}

/* PRINT */

@media print {
    body * {
        visibility: hidden;
    }

    .print-area,
    .print-area * {
        visibility: visible;
    }

    .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   LEVORO DATABASE
========================================================= */

const STORAGE_KEY = "levoro_v2";

let db = {
    companies: [],
    users: [],
    timeEntries: [],
    paystubs: [],
    activity: []
};

let currentUser = null;
let selectedCompanyId = null;
let currentPage = "dashboard";

function loadDB() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        try {
            db = JSON.parse(saved);
        } catch {
            db = {
                companies: [],
                users: [],
                timeEntries: [],
                paystubs: [],
                activity: []
            };
        }
    }
}

function saveDB() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

/* =========================================================
   HELPERS
========================================================= */

function id() {
    return Date.now() + Math.floor(Math.random() * 10000);
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function money(value) {
    return "$" + Number(value || 0).toFixed(2);
}

function formatDate(date) {
    if (!date) return "-";

    return new Date(date + "T00:00:00").toLocaleDateString(
        "en-CA",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}

function formatDateTime(date) {
    return new Date(date).toLocaleString(
        "en-CA",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}

function today() {
    return new Date().toISOString().split("T")[0];
}

function addDays(dateString, days) {
    const date = new Date(dateString + "T00:00:00");
    date.setDate(date.getDate() + days);
    return date.toISOString().split("T")[0];
}

function daysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
}

function calculatePeriod(start, frequency) {
    let end;

    if (frequency === "weekly") {
        end = addDays(start, 6);
    }

    if (frequency === "biweekly") {
        end = addDays(start, 13);
    }

    if (frequency === "monthly") {
        const d = new Date(start + "T00:00:00");
        const last = daysInMonth(
            d.getFullYear(),
            d.getMonth()
        );

        end = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${last}`;
    }

    return { start, end };
}

function getCompany(id) {
    return db.companies.find(c => c.id === id);
}

function getUser(id) {
    return db.users.find(u => u.id === id);
}

function currentCompany() {
    if (!currentUser) return null;

    return getCompany(
        currentUser.companyId || selectedCompanyId
    );
}

function companyPeriod(company) {
    if (!company) return null;

    const start = company.payPeriodStart;
    return calculatePeriod(start, company.payFrequency);
}

function addActivity(action, description) {
    db.activity.push({
        id: id(),
        action,
        description,
        userId: currentUser ? currentUser.id : null,
        userName: currentUser ? currentUser.name : "System",
        timestamp: new Date().toISOString()
    });

    saveDB();
}

/* =========================================================
   AUTH
========================================================= */

function login() {
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    const user = db.users.find(
        u =>
            u.username.toLowerCase() === username.toLowerCase() &&
            u.password === password &&
            u.active !== false
    );

    const error = document.getElementById("loginError");

    if (!user) {
        error.textContent = "Invalid username or password.";
        error.classList.remove("hidden");
        return;
    }

    currentUser = user;

    if (user.companyId) {
        selectedCompanyId = user.companyId;
    }

    addActivity("LOGIN", `${user.name} logged in.`);

    currentPage = "dashboard";
    render();
}

function logout() {
    if (currentUser) {
        addActivity("LOGOUT", `${currentUser.name} logged out.`);
    }

    currentUser = null;
    selectedCompanyId = null;
    render();
}

function togglePassword() {
    const input = document.getElementById("loginPassword");
    const button = document.querySelector(".password-toggle");

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
    } else {
        input.type = "password";
        button.textContent = "Show";
    }
}

/* =========================================================
   COMPANY MANAGEMENT
========================================================= */

function openCompanyModal(companyId = null) {
    const company = companyId ? getCompany(companyId) : null;

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">

                <div class="modal-header">
                    <div class="modal-title">
                        ${company ? "Edit Company" : "Add Company"}
                    </div>
                    <button class="close" onclick="closeModal()">×</button>
                </div>

                <div class="form-group">
                    <label>Company Name *</label>
                    <input
                        id="companyName"
                        class="form-control"
                        value="${escapeHTML(company?.name || "")}"
                        placeholder="Company name"
                    >
                </div>

                <div class="grid-2">

                    <div class="form-group">
                        <label>Pay Frequency *</label>
                        <select id="payFrequency" class="form-control">
                            <option value="weekly"
                                ${company?.payFrequency === "weekly" ? "selected" : ""}>
                                Weekly
                            </option>

                            <option value="biweekly"
                                ${company?.payFrequency === "biweekly" ? "selected" : ""}>
                                Bi-Weekly
                            </option>

                            <option value="monthly"
                                ${company?.payFrequency === "monthly" ? "selected" : ""}>
                                Monthly
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>First Pay Period Start *</label>
                        <input
                            id="payPeriodStart"
                            type="date"
                            class="form-control"
                            value="${company?.payPeriodStart || today()}"
                        >
                    </div>

                </div>

                <div class="card" style="background:#f7f9fc;margin-top:10px;">
                    <strong>Pay Period Preview</strong>
                    <div id="periodPreview" style="margin-top:8px;color:#697386;">
                        Select a date and frequency.
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>

                    <button class="btn btn-primary"
                        onclick="saveCompany(${companyId || "null"})">
                        ${company ? "Save Changes" : "Create Company"}
                    </button>
                </div>

            </div>
        </div>
    `;

    updatePeriodPreview();

    document.getElementById("payFrequency")
        .addEventListener("change", updatePeriodPreview);

    document.getElementById("payPeriodStart")
        .addEventListener("change", updatePeriodPreview);
}

function updatePeriodPreview() {
    const start = document.getElementById("payPeriodStart")?.value;
    const frequency = document.getElementById("payFrequency")?.value;
    const preview = document.getElementById("periodPreview");

    if (!start || !frequency || !preview) return;

    const period = calculatePeriod(start, frequency);

    preview.innerHTML =
        `<strong>${formatDate(period.start)}</strong>
        → <strong>${formatDate(period.end)}</strong>`;
}

function saveCompany(companyId) {
    const name = document.getElementById("companyName").value.trim();
    const frequency = document.getElementById("payFrequency").value;
    const start = document.getElementById("payPeriodStart").value;

    if (!name || !start) {
        alert("Please complete all required fields.");
        return;
    }

    if (companyId) {
        const company = getCompany(companyId);

        company.name = name;
        company.payFrequency = frequency;
        company.payPeriodStart = start;

        addActivity(
            "UPDATE_COMPANY",
            `Updated company ${name}.`
        );

    } else {
        const company = {
            id: id(),
            name,
            payFrequency: frequency,
            payPeriodStart: start,
            active: true
        };

        db.companies.push(company);
        selectedCompanyId = company.id;

        addActivity(
            "CREATE_COMPANY",
            `Created company ${name}.`
        );
    }

    saveDB();
    closeModal();
    render();
}

function deleteCompany(companyId) {
    const company = getCompany(companyId);

    if (!company) return;

    if (
        !confirm(
            `Delete ${company.name}?\n\nThis will also remove employees, managers, timesheets and payroll records for this company.`
        )
    ) {
        return;
    }

    db.companies = db.companies.filter(c => c.id !== companyId);
    db.users = db.users.filter(u => u.companyId !== companyId);
    db.timeEntries = db.timeEntries.filter(
        t => t.companyId !== companyId
    );
    db.paystubs = db.paystubs.filter(
        p => p.companyId !== companyId
    );

    if (selectedCompanyId === companyId) {
        selectedCompanyId = null;
    }

    addActivity(
        "DELETE_COMPANY",
        `Deleted company ${company.name}.`
    );

    saveDB();
    render();
}

/* =========================================================
   USER / EMPLOYEE / MANAGER
========================================================= */

function openUserModal(type, userId = null) {
    const existing = userId ? getUser(userId) : null;

    const companyOptions = db.companies.map(c => `
        <option value="${c.id}"
            ${existing?.companyId === c.id ? "selected" : ""}>
            ${escapeHTML(c.name)}
        </option>
    `).join("");

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">

                <div class="modal-header">
                    <div class="modal-title">
                        ${existing ? "Edit User" : "Add " + (type === "manager" ? "Manager" : "Employee")}
                    </div>
                    <button class="close" onclick="closeModal()">×</button>
                </div>

                <div class="grid-2">

                    <div class="form-group">
                        <label>Name *</label>
                        <input id="userName" class="form-control"
                            value="${escapeHTML(existing?.name || "")}">
                    </div>

                    <div class="form-group">
                        <label>Username *</label>
                        <input id="userUsername" class="form-control"
                            value="${escapeHTML(existing?.username || "")}">
                    </div>

                    <div class="form-group">
                        <label>Password ${existing ? "" : "*"}</label>
                        <input id="userPassword" type="password" class="form-control"
                            placeholder="${existing ? "Leave blank to keep current password" : ""}">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input id="userEmail" type="email" class="form-control"
                            value="${escapeHTML(existing?.email || "")}">
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input id="userPhone" class="form-control"
                            value="${escapeHTML(existing?.phone || "")}">
                    </div>

                    <div class="form-group">
                        <label>Hourly Rate</label>
                        <input id="userRate" type="number" step="0.01"
                            class="form-control"
                            value="${existing?.rate ?? ""}">
                    </div>

                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea id="userAddress" class="form-control"
                        rows="3">${escapeHTML(existing?.address || "")}</textarea>
                </div>

                <div class="form-group">
                    <label>Company *</label>
                    <select id="userCompany" class="form-control">
                        <option value="">Select company</option>
                        ${companyOptions}
                    </select>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>

                    <button class="btn btn-primary"
                        onclick="saveUser('${type}', ${userId || "null"})">
                        Save
                    </button>
                </div>

            </div>
        </div>
    `;
}

function saveUser(type, userId) {
    const name = document.getElementById("userName").value.trim();
    const username = document.getElementById("userUsername").value.trim();
    const password = document.getElementById("userPassword").value;
    const companyId = Number(document.getElementById("userCompany").value);

    if (!name || !username || !companyId) {
        alert("Name, username and company are required.");
        return;
    }

    const duplicate = db.users.find(
        u =>
            u.username.toLowerCase() === username.toLowerCase() &&
            u.id !== userId
    );

    if (duplicate) {
        alert("That username is already in use.");
        return;
    }

    if (userId) {
        const user = getUser(userId);

        user.name = name;
        user.username = username;
        user.email = document.getElementById("userEmail").value.trim();
        user.phone = document.getElementById("userPhone").value.trim();
        user.address = document.getElementById("userAddress").value.trim();
        user.rate = Number(document.getElementById("userRate").value || 0);
        user.companyId = companyId;

        if (password) {
            user.password = password;
        }

        addActivity(
            "UPDATE_EMPLOYEE",
            `Updated ${type} ${name}.`
        );

    } else {
        if (!password) {
            alert("Password is required.");
            return;
        }

        const user = {
            id: id(),
            role: type,
            name,
            username,
            password,
            email: document.getElementById("userEmail").value.trim(),
            phone: document.getElementById("userPhone").value.trim(),
            address: document.getElementById("userAddress").value.trim(),
            rate: Number(document.getElementById("userRate").value || 0),
            companyId,
            active: true
        };

        db.users.push(user);

        addActivity(
            type === "manager"
                ? "CREATE_MANAGER"
                : "CREATE_EMPLOYEE",
            `Created ${type} ${name}.`
        );
    }

    saveDB();
    closeModal();
    render();
}

function deleteUser(userId) {
    const user = getUser(userId);

    if (!user) return;

    if (!confirm(`Delete ${user.name}?`)) return;

    db.users = db.users.filter(u => u.id !== userId);

    addActivity(
        "DELETE_EMPLOYEE",
        `Deleted ${user.name}.`
    );

    saveDB();
    render();
}

/* =========================================================
   TIME TRACKING
========================================================= */

function getCurrentPeriodForEmployee() {
    const company = currentCompany();
    return companyPeriod(company);
}

function employeeClockIn() {
    const company = currentCompany();
    const period = getCurrentPeriodForEmployee();

    if (!company || !period) return;

    const existing = db.timeEntries.find(
        t =>
            t.employeeId === currentUser.id &&
            t.date === today() &&
            !t.endTime
    );

    if (existing) {
        alert("You are already clocked in.");
        return;
    }

    db.timeEntries.push({
        id: id(),
        employeeId: currentUser.id,
        companyId: company.id,
        date: today(),
        startTime: new Date().toISOString(),
        endTime: null,
        hours: 0,
        status: "open",
        periodStart: period.start,
        periodEnd: period.end
    });

    saveDB();
    render();
}

function employeeClockOut() {
    const entry = db.timeEntries.find(
        t =>
            t.employeeId === currentUser.id &&
            t.date === today() &&
            !t.endTime
    );

    if (!entry) {
        alert("You are not currently clocked in.");
        return;
    }

    entry.endTime = new Date().toISOString();

    const start = new Date(entry.startTime);
    const end = new Date(entry.endTime);

    entry.hours = Number(
        ((end - start) / 3600000).toFixed(2)
    );

    saveDB();
    render();
}

function submitTimesheet() {
    const company = currentCompany();
    const period = companyPeriod(company);

    const entries = db.timeEntries.filter(
        t =>
            t.employeeId === currentUser.id &&
            t.periodStart === period.start &&
            t.periodEnd === period.end
    );

    if (!entries.length) {
        alert("There are no hours to submit.");
        return;
    }

    if (entries.some(e => !e.endTime)) {
        alert("Please clock out before submitting.");
        return;
    }

    entries.forEach(e => {
        if (e.status !== "approved") {
            e.status = "submitted";
        }
    });

    saveDB();
    render();
}

/* =========================================================
   MANAGER APPROVAL
========================================================= */

function approveEmployeeTimesheet(employeeId, periodStart, periodEnd) {
    const entries = db.timeEntries.filter(
        t =>
            t.employeeId === employeeId &&
            t.periodStart === periodStart &&
            t.periodEnd === periodEnd
    );

    if (!entries.length) return;

    entries.forEach(e => {
        e.status = "approved";
        e.approvedBy = currentUser.id;
        e.approvedAt = new Date().toISOString();
    });

    const employee = getUser(employeeId);

    addActivity(
        "APPROVE_PAYSTUB",
        `Approved ${employee.name}'s hours for ${formatDate(periodStart)} - ${formatDate(periodEnd)}.`
    );

    saveDB();
    render();
}

/* =========================================================
   PAYROLL
========================================================= */

function getEmployeeHours(employeeId, start, end) {
    return db.timeEntries
        .filter(
            t =>
                t.employeeId === employeeId &&
                t.periodStart === start &&
                t.periodEnd === end &&
                t.status === "approved"
        )
        .reduce(
            (sum, t) => sum + Number(t.hours || 0),
            0
        );
}

function issuePaystub(employeeId, start, end) {
    const employee = getUser(employeeId);
    const company = getCompany(employee.companyId);

    const existing = db.paystubs.find(
        p =>
            p.employeeId === employeeId &&
            p.periodStart === start &&
            p.periodEnd === end
    );

    if (existing) {
        alert("A paystub has already been issued for this period.");
        return;
    }

    const hours = getEmployeeHours(
        employeeId,
        start,
        end
    );

    if (hours <= 0) {
        alert("No approved hours found.");
        return;
    }

    const gross = hours * Number(employee.rate || 0);

    db.paystubs.push({
        id: id(),
        employeeId,
        companyId: company.id,
        periodStart: start,
        periodEnd: end,
        hours,
        rate: Number(employee.rate || 0),
        gross,
        issuedAt: new Date().toISOString(),
        issuedBy: currentUser.id
    });

    db.timeEntries
        .filter(
            t =>
                t.employeeId === employeeId &&
                t.periodStart === start &&
                t.periodEnd === end
        )
        .forEach(t => t.status = "issued");

    addActivity(
        "ISSUE_PAYSTUB",
        `Issued paystub for ${employee.name}, ${formatDate(start)} - ${formatDate(end)}.`
    );

    saveDB();

    openPaystub(
        db.paystubs[db.paystubs.length - 1].id
    );
}

/* =========================================================
   CSV EXPORT
========================================================= */

function exportPayrollCSV() {
    const company = currentCompany();

    if (!company) {
        alert("Please select a company.");
        return;
    }

    const period = companyPeriod(company);

    const rows = db.users
        .filter(
            u =>
                u.companyId === company.id &&
                u.role === "employee"
        )
        .map(employee => {
            const hours = getEmployeeHours(
                employee.id,
                period.start,
                period.end
            );

            return [
                employee.name,
                employee.username,
                period.start,
                period.end,
                hours,
                employee.rate,
                hours * employee.rate
            ];
        });

    if (!rows.length) {
        alert("No payroll records found.");
        return;
    }

    let csv =
        "Employee,Username,Period Start,Period End,Hours,Hourly Rate,Gross Pay\n";

    rows.forEach(row => {
        csv += row.join(",") + "\n";
    });

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download =
        `${company.name.replace(/\s+/g, "_")}_Payroll.csv`;

    a.click();

    URL.revokeObjectURL(url);
}

/* =========================================================
   ACTIVITY LOG
========================================================= */

function renderActivity() {
    const from =
        document.getElementById("activityFrom")?.value || "";

    const to =
        document.getElementById("activityTo")?.value || "";

    let logs = [...db.activity];

    if (from) {
        logs = logs.filter(
            l => l.timestamp.slice(0,10) >= from
        );
    }

    if (to) {
        logs = logs.filter(
            l => l.timestamp.slice(0,10) <= to
        );
    }

    logs.sort(
        (a,b) =>
            new Date(b.timestamp) -
            new Date(a.timestamp)
    );

    const tbody = document.getElementById("activityRows");

    if (!tbody) return;

    tbody.innerHTML = logs.map(log => `
        <tr>
            <td>${formatDateTime(log.timestamp)}</td>
            <td>
                <span class="badge badge-open">
                    ${escapeHTML(log.action)}
                </span>
            </td>
            <td>${escapeHTML(log.description)}</td>
            <td>${escapeHTML(log.userName)}</td>
        </tr>
    `).join("") || `
        <tr>
            <td colspan="4" class="empty">
                No activity found.
            </td>
        </tr>
    `;
}

function clearActivityFilters() {
    document.getElementById("activityFrom").value = "";
    document.getElementById("activityTo").value = "";
    renderActivity();
}

function renderTimesheets() {
    const company = currentCompany();
    const period = companyPeriod(company);

    const employees = db.users.filter(
        u =>
            u.role === "employee" &&
            u.companyId === company.id
    );

    return `
        <div class="card">

            <div class="card-header">

                <div>
                    <div class="card-title">
                        Timesheet Approval
                    </div>

                    <div style="color:#697386;">
                        ${escapeHTML(company.name)}
                        •
                        ${formatDate(period.start)}
                        -
                        ${formatDate(period.end)}
                    </div>
                </div>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Hours</th>
                            <th>Rate</th>
                            <th>Gross Pay</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>

                    ${
                        employees.map(employee => {

                            const entries =
                                db.timeEntries.filter(
                                    e =>
                                        e.employeeId === employee.id &&
                                        e.periodStart === period.start &&
                                        e.periodEnd === period.end
                                );

                            const hours = entries.reduce(
                                (s,e) =>
                                    s + Number(e.hours || 0),
                                0
                            );

                            const submitted =
                                entries.some(
                                    e =>
                                        e.status === "submitted"
                                );

                            const approved =
                                entries.length &&
                                entries.every(
                                    e =>
                                        e.status === "approved" ||
                                        e.status === "issued"
                                );

                            return `
                                <tr>

                                    <td>
                                        <strong>
                                            ${escapeHTML(employee.name)}
                                        </strong>
                                    </td>

                                    <td>
                                        ${hours.toFixed(2)}
                                    </td>

                                    <td>
                                        ${money(employee.rate)}
                                    </td>

                                    <td>
                                        ${money(
                                            hours * employee.rate
                                        )}
                                    </td>

                                    <td>
                                        ${
                                            approved
                                            ? `<span class="badge badge-approved">Approved</span>`
                                            : submitted
                                            ? `<span class="badge badge-submitted">Pending Approval</span>`
                                            : `<span class="badge badge-open">Open</span>`
                                        }
                                    </td>

                                    <td>

                                        ${
                                            submitted && !approved
                                            ? `
                                                <button
                                                    class="btn btn-success btn-small"
                                                    onclick="approveEmployeeTimesheet(
                                                        ${employee.id},
                                                        '${period.start}',
                                                        '${period.end}'
                                                    )">
                                                    Approve
                                                </button>
                                            `
                                            : ""
                                        }

                                    </td>

                                </tr>
                            `;
                        }).join("")
                        ||
                        `
                            <tr>
                                <td colspan="6"
                                    class="empty">
                                    No employees found.
                                </td>
                            </tr>
                        `
                    }

                    </tbody>

                </table>

            </div>

        </div>
    `;
}

function renderPayroll() {
    const company = currentCompany();

    if (!company) {
        return `
            <div class="card">
                <div class="empty">
                    No company selected.
                </div>
            </div>
        `;
    }

    const period = companyPeriod(company);

    const employees = db.users.filter(
        u =>
            u.role === "employee" &&
            u.companyId === company.id
    );

    return `
        <div class="card">

            <div class="card-header">

                <div>
                    <div class="card-title">
                        Payroll
                    </div>

                    <div style="color:#697386;">
                        ${escapeHTML(company.name)}
                        •
                        ${formatDate(period.start)}
                        -
                        ${formatDate(period.end)}
                    </div>
                </div>

                <button
                    class="btn btn-secondary"
                    onclick="exportPayrollCSV()">
                    Export CSV
                </button>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Hours</th>
                            <th>Rate</th>
                            <th>Gross Pay</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>

                    ${
                        employees.map(employee => {

                            const hours =
                                getEmployeeHours(
                                    employee.id,
                                    period.start,
                                    period.end
                                );

                            const gross =
                                hours * employee.rate;

                            const paystub =
                                db.paystubs.find(
                                    p =>
                                        p.employeeId === employee.id &&
                                        p.periodStart === period.start &&
                                        p.periodEnd === period.end
                                );

                            return `
                                <tr>

                                    <td>
                                        <strong>
                                            ${escapeHTML(employee.name)}
                                        </strong>
                                    </td>

                                    <td>
                                        ${hours.toFixed(2)}
                                    </td>

                                    <td>
                                        ${money(employee.rate)}
                                    </td>

                                    <td>
                                        ${money(gross)}
                                    </td>

                                    <td>
                                        ${
                                            paystub
                                            ? `<span class="badge badge-issued">Paystub Issued</span>`
                                            : hours > 0
                                            ? `<span class="badge badge-approved">Approved</span>`
                                            : `<span class="badge badge-open">Waiting</span>`
                                        }
                                    </td>

                                    <td>

                                        ${
                                            paystub
                                            ? `
                                                <button
                                                    class="btn btn-secondary btn-small"
                                                    onclick="openPaystub(${paystub.id})">
                                                    View Paystub
                                                </button>
                                            `
                                            : hours > 0
                                            ? `
                                                <button
                                                    class="btn btn-primary btn-small"
                                                    onclick="issuePaystub(
                                                        ${employee.id},
                                                        '${period.start}',
                                                        '${period.end}'
                                                    )">
                                                    Issue Paystub
                                                </button>
                                            `
                                            : "-"
                                        }

                                    </td>

                                </tr>
                            `;
                        }).join("")
                    }

                    </tbody>

                </table>

            </div>

        </div>
    `;
}

/* =========================================================
   STATUS
========================================================= */

function statusBadge(status) {
    const labels = {
        open: "Open",
        submitted: "Submitted",
        approved: "Approved",
        issued: "Paystub Issued",
        closed: "Closed"
    };

    const classes = {
        open: "badge-open",
        submitted: "badge-submitted",
        approved: "badge-approved",
        issued: "badge-issued",
        closed: "badge-closed"
    };

    return `
        <span class="badge ${classes[status] || "badge-open"}">
            ${labels[status] || status}
        </span>
    `;
}

function closeModal(event) {
